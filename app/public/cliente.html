<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SaleListo · Menú de mesa</title>
  <link rel="icon" type="image/svg+xml" href="mark.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cliente.css">
</head>
<body>
  <div class="app" id="invalidWrap" hidden></div>

  <div class="app" id="clientApp" hidden>
    <header class="top">
      <div>
        <p class="top-sub">
          <img src="mark.svg" alt="" style="width:16px;height:16px;display:block;flex:none">
          <span><span id="restName">Kaiten Bar</span> · <span id="blockLabel">Salón</span></span>
        </p>
        <h1 class="top-title">Mesa <span id="tableCode">--</span></h1>
        <div class="top-waiter" id="waiterBadge"></div>
      </div>
      <div class="top-status" id="callStatus" hidden></div>
    </header>

    <!-- Vista: Menú -->
    <main class="view" id="view-menu">
      <div class="menu-sticky" id="menuSticky">
        <div class="search-row">
          <span class="search-ico" aria-hidden="true">🔍</span>
          <input
            class="search-input"
            id="menuSearch"
            type="search"
            placeholder="Buscar plato o bebida..."
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="search"
            aria-label="Buscar plato o bebida"
            maxlength="40"
          >
          <button class="search-clear" id="searchClear" type="button" aria-label="Borrar búsqueda" hidden>✕</button>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filtros rápidos"></div>
        <nav class="cats" id="cats"></nav>
      </div>
      <p class="result-hint" id="resultHint" hidden></p>
      <div id="menuList"></div>
      <div class="spacer"></div>
    </main>

    <!-- Vista: Mis pedidos -->
    <main class="view" id="view-orders" hidden>
      <h2 class="view-title">Mis pedidos en curso</h2>
      <div id="ordersList"></div>
      <div class="spacer"></div>
    </main>

    <button class="cart-bar" id="cartBar" hidden>
      <span class="cart-count" id="cartCount">0</span>
      <span>Ver mi pedido</span>
      <strong id="cartTotal">$0</strong>
    </button>

    <nav class="tabbar">
      <button class="tab active" data-tab="menu"><span class="tab-ico">📖</span>Menú</button>
      <button class="tab" data-tab="orders"><span class="tab-ico">🧾</span>Pedidos<span class="dot" id="ordersDot" hidden></span></button>
      <button class="tab" data-action="mozo"><span class="tab-ico">🙋</span>Mozo</button>
      <button class="tab" data-action="cuenta"><span class="tab-ico">💳</span>Cuenta</button>
    </nav>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="sheet" hidden></section>
  </div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
