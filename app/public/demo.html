<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaleListo · Demo en Vivo 4 Pantallas</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: #181512; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .bar {
      display: flex; align-items: center; gap: 14px; padding: 10px 18px; min-height: 54px;
      background: #231f1a; border-bottom: 1px solid #352f28; flex-wrap: wrap;
    }
    .bar strong { font-size: 15px; }
    .bar .grow { flex: 1; }
    .bar select {
      background: #2f2923; border: 1px solid #453c33; color: #fff;
      padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
    }
    .bar label { font-size: 12.5px; color: rgba(255,255,255,.75); display: inline-flex; align-items: center; gap: 6px; }
    .bar a { color: rgba(255,255,255,.8); font-size: 13px; text-decoration: none; font-weight: 600; }

    .stage {
      flex: 1; display: grid; grid-template-columns: 350px 350px 1fr; gap: 16px;
      padding: 12px 18px 18px; min-height: 0;
    }
    .col-wrap { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
    .col-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .label { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.6); }

    .phone {
      flex: 1; border-radius: 38px; padding: 10px; background: #0c0a08;
      box-shadow: 0 0 0 2px #3a332b, 0 20px 60px rgba(0,0,0,.45); min-height: 0;
    }
    .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 28px; background: #faf7f2; }

    .panel {
      flex: 1; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px #3a332b; min-height: 0;
    }
    .panel iframe { width: 100%; height: 100%; border: 0; background: #faf7f2; }

    .r-tabs { display: flex; gap: 4px; background: #26211c; padding: 3px; border-radius: 9px; }
    .r-tab { padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.68); }
    .r-tab.active { background: var(--accent); color: #fff; }

    @media (max-width: 1260px) {
      body { height: auto; overflow: auto; }
      .stage { grid-template-columns: 1fr 1fr; height: auto; }
      .phone { height: 740px; }
      .panel { height: 820px; }
      .col-wrap.wide { grid-column: 1 / -1; }
    }
    @media (max-width: 780px) {
      .stage { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <strong>SaleListo · Circuito Completo en Tiempo Real</strong>
    <span class="grow"></span>
    <label>📱 Mesa Cliente: <select id="clientTableSel"></select></label>
    <label>🏃 Celular Mozo: <select id="waiterSel"></select></label>
    <a href="index.html">Portada</a>
  </header>

  <main class="stage">
    <div class="col-wrap">
      <div class="col-head"><span class="label">1 · Celular del Cliente (4G / QR fijo)</span></div>
      <div class="phone"><iframe id="clientFrame" title="Vista Cliente"></iframe></div>
    </div>

    <div class="col-wrap">
      <div class="col-head"><span class="label">2 · Celular del Mozo en Salón</span></div>
      <div class="phone"><iframe id="waiterFrame" title="Vista Mozo"></iframe></div>
    </div>

    <div class="col-wrap wide">
      <div class="col-head">
        <span class="label">3 · Restaurante (Encargado / Cocina / Barra)</span>
        <div class="r-tabs" id="rightTabs">
          <button class="r-tab active" data-src="restaurante.html?demo=1">🖥️ Panel Encargado</button>
          <button class="r-tab" data-src="cocina.html?estacion=cocina">🍳 Pantalla Cocina</button>
          <button class="r-tab" data-src="cocina.html?estacion=barra">🍸 Pantalla Barra</button>
        </div>
      </div>
      <div class="panel"><iframe id="rightFrame" src="restaurante.html?demo=1" title="Panel Restaurante"></iframe></div>
    </div>
  </main>

  <script>
    (async () => {
      const [qrs, wpub] = await Promise.all([
        fetch('api/qrs').then((r) => r.json()),
        fetch('api/waiters-public').then((r) => r.json()),
      ]);

      const tSel = document.getElementById('clientTableSel');
      const wSel = document.getElementById('waiterSel');
      const cFrame = document.getElementById('clientFrame');
      const wFrame = document.getElementById('waiterFrame');
      const rFrame = document.getElementById('rightFrame');

      qrs.blocks.forEach((b) => {
        b.tables.forEach((t) => {
          tSel.add(new Option(`${b.name} · Mesa ${t.code}`, t.qrToken));
        });
      });
      if (tSel.options.length > 3) tSel.selectedIndex = 3;

      wpub.waiters.forEach((w) => {
        wSel.add(new Option(`${w.name}${w.available ? '' : ' (fuera)'}`, w.id));
      });

      const syncClient = () => {
        if (tSel.value) cFrame.src = `cliente.html?t=${encodeURIComponent(tSel.value)}`;
      };
      const syncWaiter = () => {
        wFrame.src = wSel.value ? `mozo.html?waiter=${encodeURIComponent(wSel.value)}` : 'mozo.html';
      };

      tSel.onchange = syncClient;
      wSel.onchange = syncWaiter;
      syncClient();
      syncWaiter();

      document.getElementById('rightTabs').onclick = (e) => {
        const b = e.target.closest('[data-src]');
        if (!b) return;
        document.querySelectorAll('.r-tab').forEach((x) => x.classList.toggle('active', x === b));
        rFrame.src = b.dataset.src;
      };
    })();
  </script>
</body>
</html>
