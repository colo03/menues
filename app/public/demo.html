<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaleListo · Demo Interactiva en Tiempo Real</title>
  <meta name="description" content="Probá el circuito completo de SaleListo en tiempo real: celular del comensal por QR, app de mozo con Modo Pulsera, Estación de Pase y monitores de Cocina, Barra y Mostrador.">
  <link rel="canonical" href="https://salelisto.com/demo.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:site_name" content="SaleListo">
  <meta property="og:url" content="https://salelisto.com/demo.html">
  <meta property="og:title" content="SaleListo · Demo Interactiva en Tiempo Real">
  <meta property="og:description" content="Probá la hora pico en vivo en 1 clic: carta QR, Cocina y Barra separadas, Estación de Mozos fija y cuenta resuelta en un solo viaje.">
  <meta property="og:image" content="https://salelisto.com/og-salelisto.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://salelisto.com/og-salelisto.png">
  <link rel="icon" type="image/svg+xml" href="mark.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: var(--dark-bg); color: var(--dark-ink); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .bar {
      display: flex; align-items: center; gap: 10px; padding: 9px 18px; min-height: 54px;
      background: var(--dark-surface); border-bottom: 1px solid var(--dark-line); flex-wrap: wrap;
    }
    .bar-brand { display: inline-flex; align-items: center; gap: 10px; }
    .bar-sep { color: rgba(250, 247, 242, 0.28); font-weight: 700; }
    .bar strong { font-size: 14px; font-weight: 700; color: rgba(250, 247, 242, 0.9); }
    .bar .grow { flex: 1; min-width: 8px; }
    .bar select {
      background: var(--dark-bg); border: 1px solid var(--dark-line); color: var(--dark-ink);
      padding: 6px 10px; border-radius: var(--radius-control); font-size: 12.5px; font-weight: 600;
    }
    .bar label { font-size: 12px; color: rgba(250, 247, 242, 0.75); display: inline-flex; align-items: center; gap: 6px; }
    .bar a, .bar .bar-ghost {
      color: rgba(250, 247, 242, 0.86); font-size: 12.5px; text-decoration: none; font-weight: 600;
      padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--dark-line);
      background: transparent; transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
      white-space: nowrap;
    }
    .bar a:hover, .bar .bar-ghost:hover { background: rgba(250, 247, 242, 0.08); border-color: rgba(250, 247, 242, 0.28); }

    .sim-btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px;
      border-radius: var(--radius-pill); font-size: 13px; font-weight: 800;
      background: linear-gradient(135deg, #D9412B 0%, #E85A3C 100%); color: #ffffff;
      box-shadow: 0 4px 16px rgba(217, 65, 43, 0.38);
      transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
      white-space: nowrap;
    }
    .sim-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217, 65, 43, 0.5); }
    .sim-btn:active { transform: scale(0.98); }
    .sim-btn[disabled] { opacity: 0.68; pointer-events: none; }

    /* Barra narradora paso a paso del Simulador de Hora Pico */
    .sim-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 8px 18px; background: #231E1B; border-bottom: 1px solid var(--dark-line);
      font-size: 12.5px; animation: fade-strip var(--dur-fast) var(--ease-out);
    }
    @keyframes fade-strip { from { opacity: 0; transform: translateY(-4px); } }
    .sim-steps { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sim-step {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
      border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 700;
      background: rgba(250, 247, 242, 0.06); color: rgba(250, 247, 242, 0.46);
      border: 1px solid transparent; transition: all var(--dur-fast) var(--ease-out);
    }
    .sim-step.current {
      background: rgba(217, 65, 43, 0.22); color: #FFB4A6; border-color: rgba(217, 65, 43, 0.55);
    }
    .sim-step.done {
      background: rgba(47, 138, 87, 0.22); color: #8CE0B1; border-color: rgba(47, 138, 87, 0.45);
    }
    .sim-msg { flex: 1; min-width: 220px; font-weight: 600; color: var(--dark-ink); }
    .sim-msg strong { color: #FFB4A6; }
    .sim-close {
      width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
      color: rgba(250, 247, 242, 0.6); font-size: 13px;
    }
    .sim-close:hover { background: rgba(250, 247, 242, 0.1); color: #ffffff; }

    .stage {
      flex: 1; display: grid; grid-template-columns: 304px 304px 1fr; gap: 14px;
      padding: 12px 18px 18px; min-height: 0;
    }
    .col-wrap { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
    .col-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(250, 247, 242, 0.62); }

    .phone {
      flex: 1; border-radius: 36px; padding: 9px; background: #12100e;
      box-shadow: 0 0 0 1.5px var(--dark-line), 0 20px 56px rgba(0, 0, 0, 0.42); min-height: 0;
      display: flex; overflow: hidden;
    }
    .phone-screen {
      position: relative; flex: 1; border-radius: 27px; overflow: hidden; background: var(--bg); min-height: 0;
    }
    .phone-screen iframe {
      position: absolute; top: 0; left: 0; border: 0; background: var(--bg);
      width: 136%; height: 136%; transform: scale(0.735294); transform-origin: 0 0;
    }

    .panel {
      position: relative; flex: 1; border-radius: var(--radius-card); overflow: hidden;
      box-shadow: 0 0 0 1px var(--dark-line); min-height: 0; background: var(--bg);
    }
    .panel iframe {
      position: absolute; top: 0; left: 0; border: 0; background: var(--bg);
      width: 140%; height: 140%; transform: scale(0.7142857); transform-origin: 0 0;
    }

    .r-tabs { display: flex; gap: 4px; background: var(--dark-surface); padding: 3px; border-radius: var(--radius-control); border: 1px solid var(--dark-line); flex-wrap: wrap; }
    .r-tab { padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; color: rgba(250, 247, 242, 0.7); transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
    .r-tab.active { background: var(--accent); color: #ffffff; }

    /* Switcher de pantallas exclusivo para celular y tablet */
    .mobile-switcher {
      display: none; gap: 6px; padding: 8px 12px;
      background: #171412; border-bottom: 1px solid var(--dark-line);
    }
    .m-tab {
      flex: 1; padding: 9px 8px; border-radius: 10px; font-size: 12.5px; font-weight: 800;
      background: var(--dark-surface); color: rgba(250, 247, 242, 0.72);
      border: 1px solid var(--dark-line); text-align: center; white-space: nowrap;
      transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }
    .m-tab.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }

    .sim-retry {
      margin-left: 10px; padding: 4px 10px; border-radius: var(--radius-pill);
      background: var(--accent); color: #ffffff; font-size: 12px; font-weight: 800;
    }

    @media (max-width: 1260px) and (min-width: 1025px) {
      body { height: auto; overflow: auto; }
      .stage { grid-template-columns: 1fr 1fr; height: auto; }
      .phone { height: 740px; }
      .phone-screen iframe { width: 100%; height: 100%; transform: none; }
      .panel { height: 820px; }
      .panel iframe { width: 100%; height: 100%; transform: none; }
      .col-wrap.wide { grid-column: 1 / -1; }
    }
    @media (max-width: 1024px) {
      body { height: 100vh; height: 100dvh; overflow: hidden; }
      .bar { padding: 8px 12px; gap: 6px 8px; min-height: auto; }
      .bar-brand strong, .bar-sep, .bar .grow, .bar .bar-desktop-only { display: none; }
      .bar label { font-size: 11.5px; }
      .bar select { padding: 5px 8px; font-size: 12px; max-width: 138px; }
      .sim-btn { padding: 6px 11px; font-size: 12px; }
      .bar a, .bar .bar-ghost { padding: 5px 8px; font-size: 11.5px; }
      .sim-strip { padding: 6px 12px; font-size: 12px; }
      .sim-steps { display: none; }
      .mobile-switcher { display: flex; }
      .stage {
        flex: 1; display: flex; flex-direction: column;
        padding: 8px 10px 10px; min-height: 0; overflow: hidden;
      }
      .col-wrap { display: none; flex: 1; min-height: 0; gap: 6px; }
      .col-wrap.m-active { display: flex; }
      .col-wrap .label { display: none; }
      .phone { flex: 1; height: auto; border-radius: 20px; padding: 4px; }
      .phone-screen { border-radius: 16px; }
      .phone-screen iframe, .panel iframe { width: 100%; height: 100%; transform: none; }
      .panel { flex: 1; height: auto; border-radius: 14px; }
      .r-tabs { width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 4px; }
      .r-tabs::-webkit-scrollbar { display: none; }
      .r-tab { flex: 0 0 auto; white-space: nowrap; text-align: center; padding: 6px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-brand">
      <a href="/" style="border:0;padding:0;display:inline-flex" aria-label="Volver al inicio"><img src="logo-dark.svg" alt="SaleListo" style="height:30px;display:block;flex:none"></a>
      <span class="bar-sep">·</span>
      <strong>Circuito en Vivo</strong>
    </div>

    <button type="button" class="sim-btn" id="simPeakBtn" title="Dispara una secuencia automática en vivo en las 3 pantallas">
      ⚡ Simular Hora Pico
    </button>
    <button type="button" class="bar-ghost" id="clearDemoBtn" title="Limpia únicamente las mesas abiertas sin borrar el historial cerrado del día">
      ↺ Limpiar
    </button>

    <span class="grow"></span>
    <label>📱 <select id="clientTableSel" aria-label="Mesa del cliente"></select></label>
    <label>⌚ <select id="waiterSel" aria-label="Mozo seleccionado"></select></label>
    <a class="bar-desktop-only" href="pase.html" target="_blank">🛎️ Pase ↗</a>
    <a class="bar-desktop-only" href="operacion.html">Acceso Local</a>
    <a href="/">Inicio</a>
  </header>

  <nav class="mobile-switcher" id="mobileSwitcher" aria-label="Elegir pantalla de la demo">
    <button type="button" class="m-tab active" data-pane="client">📱 Cliente</button>
    <button type="button" class="m-tab" data-pane="waiter">⌚ Mozo</button>
    <button type="button" class="m-tab" data-pane="local">🛎️ Local</button>
  </nav>

  <div class="sim-strip" id="simStrip" hidden aria-live="polite">
    <div class="sim-steps" id="simSteps">
      <span class="sim-step" data-step="1">1 · Pedido mixto QR</span>
      <span class="sim-step" data-step="2">2 · Cocina + Barra listos</span>
      <span class="sim-step" data-step="3">3 · Llamado en salón</span>
      <span class="sim-step" data-step="4">4 · Cuenta + vuelto en 1 viaje</span>
    </div>
    <div class="sim-msg" id="simMsg">Listo para simular hora pico en tiempo real.</div>
    <button type="button" class="sim-close" id="simCloseBtn" aria-label="Ocultar barra de simulación">✕</button>
  </div>

  <main class="stage">
    <div class="col-wrap m-active" data-pane="client">
      <div class="col-head"><span class="label">1 · Celular del Cliente (QR de Mesa)</span></div>
      <div class="phone"><div class="phone-screen"><iframe id="clientFrame" title="Vista Cliente"></iframe></div></div>
    </div>

    <div class="col-wrap" data-pane="waiter">
      <div class="col-head"><span class="label">2 · Mozo / Pulsera Vibradora (Opcional)</span></div>
      <div class="phone"><div class="phone-screen"><iframe id="waiterFrame" title="Vista Mozo"></iframe></div></div>
    </div>

    <div class="col-wrap wide" data-pane="local">
      <div class="col-head">
        <span class="label">3 · Pantallas Fijas del Local</span>
        <div class="r-tabs" id="rightTabs">
          <button class="r-tab active" type="button" data-src="pase.html">🛎️ Pase</button>
          <button class="r-tab" type="button" data-src="cocina.html?estacion=cocina">🍳 Cocina</button>
          <button class="r-tab" type="button" data-src="cocina.html?estacion=barra">🍸 Barra</button>
          <button class="r-tab" type="button" data-src="cocina.html?estacion=mostrador">🍣 Mostrador</button>
          <button class="r-tab" type="button" data-src="restaurante.html?demo=1">🖥️ Panel</button>
        </div>
      </div>
      <div class="panel"><iframe id="rightFrame" src="pase.html" title="Pantallas Fijas del Local"></iframe></div>
    </div>
  </main>

  <script>
    (async () => {
      let adminToken = sessionStorage.getItem('salelisto:adminToken') || '';
      let simRunId = 0;

      async function ensureAdminToken() {
        if (adminToken) return adminToken;
        try {
          const r = await fetch('api/auth/admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ demo: true }),
          }).then((x) => x.json());
          if (r && r.ok && r.token) {
            adminToken = r.token;
            sessionStorage.setItem('salelisto:adminToken', adminToken);
            return adminToken;
          }
        } catch (_) {}
        const pin = prompt('Modo producción activo. Ingresá el PIN del encargado para abrir la demo:') || '';
        if (!pin) throw new Error('PIN requerido');
        const r2 = await fetch('api/auth/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        }).then((x) => x.json());
        if (!r2.ok) throw new Error(r2.error || 'PIN incorrecto');
        adminToken = r2.token;
        sessionStorage.setItem('salelisto:adminToken', adminToken);
        return adminToken;
      }

      const tSel = document.getElementById('clientTableSel');
      const wSel = document.getElementById('waiterSel');
      const cFrame = document.getElementById('clientFrame');
      const wFrame = document.getElementById('waiterFrame');
      const rFrame = document.getElementById('rightFrame');
      const simBtn = document.getElementById('simPeakBtn');
      const clearBtn = document.getElementById('clearDemoBtn');
      const simStrip = document.getElementById('simStrip');
      const simMsg = document.getElementById('simMsg');

      // Switcher de pantallas en celular / tablet
      const setMobilePane = (pane) => {
        document.querySelectorAll('.m-tab').forEach((b) => b.classList.toggle('active', b.dataset.pane === pane));
        document.querySelectorAll('.col-wrap[data-pane]').forEach((c) => c.classList.toggle('m-active', c.dataset.pane === pane));
      };
      const mobileSwitcher = document.getElementById('mobileSwitcher');
      if (mobileSwitcher) {
        mobileSwitcher.onclick = (e) => {
          const btn = e.target.closest('[data-pane]');
          if (btn) setMobilePane(btn.dataset.pane);
        };
      }

      async function fetchQrsSafe() {
        let res = await fetch('api/qrs', {
          headers: adminToken ? { 'X-Auth-Token': adminToken } : {},
        });
        if (res.status === 401) {
          adminToken = '';
          const tok = await ensureAdminToken();
          res = await fetch('api/qrs', { headers: { 'X-Auth-Token': tok } });
        }
        if (!res.ok) throw new Error('Error cargando mesas de la demo (' + res.status + ')');
        return res.json();
      }

      const syncClient = () => {
        if (tSel.value) cFrame.src = `cliente.html?t=${encodeURIComponent(tSel.value)}`;
      };
      const syncWaiter = () => {
        wFrame.src = wSel.value ? `mozo.html?waiter=${encodeURIComponent(wSel.value)}` : 'mozo.html';
      };

      const initDemoData = async () => {
        try {
          const [qrs, wpub] = await Promise.all([
            fetchQrsSafe(),
            fetch('api/waiters-public').then((r) => {
              if (!r.ok) throw new Error('Error cargando mozos (' + r.status + ')');
              return r.json();
            }),
          ]);

          tSel.innerHTML = '';
          wSel.innerHTML = '';
          const allTables = [];
          (qrs.blocks || []).forEach((b) => {
            b.tables.forEach((t) => {
              allTables.push({ ...t, blockId: b.id, blockName: b.name });
              tSel.add(new Option(`${b.name} · Mesa ${t.code}`, t.qrToken));
            });
          });

          const terrazaIdx = allTables.findIndex((t) => /terraza|exterior|patio/i.test(t.blockName));
          if (terrazaIdx >= 0) tSel.selectedIndex = terrazaIdx;
          else if (tSel.options.length > 3) tSel.selectedIndex = 3;

          (wpub.waiters || []).forEach((w) => {
            wSel.add(new Option(`${w.name}${w.available ? '' : ' (fuera)'}`, w.id));
          });
          const sofiaIdx = (wpub.waiters || []).findIndex((w) => w.available && /sof/i.test(w.name));
          if (sofiaIdx >= 0) wSel.selectedIndex = sofiaIdx;

          syncClient();
          syncWaiter();
          simStrip.hidden = true;
        } catch (err) {
          simStrip.hidden = false;
          simMsg.innerHTML = `⚠️ No pudimos conectar con el servidor de demo (${err.message || 'sin respuesta'}). <button type="button" class="sim-retry" id="retryDemoBtn">Reintentar</button>`;
          const retryBtn = document.getElementById('retryDemoBtn');
          if (retryBtn) retryBtn.onclick = initDemoData;
        }
      };

      tSel.onchange = () => { syncClient(); setMobilePane('client'); };
      wSel.onchange = () => { syncWaiter(); setMobilePane('waiter'); };
      await initDemoData();

      const viewMap = {
        pase: 'pase.html',
        cocina: 'cocina.html?estacion=cocina',
        barra: 'cocina.html?estacion=barra',
        mostrador: 'cocina.html?estacion=mostrador',
        encargado: 'restaurante.html?demo=1',
      };
      const initVista = new URLSearchParams(location.search).get('vista');
      if (initVista && viewMap[initVista]) {
        const targetSrc = viewMap[initVista];
        document.querySelectorAll('.r-tab').forEach((x) => x.classList.toggle('active', x.dataset.src === targetSrc));
        rFrame.src = targetSrc;
        setMobilePane('local');
      }

      document.getElementById('rightTabs').onclick = (e) => {
        const b = e.target.closest('[data-src]');
        if (!b) return;
        document.querySelectorAll('.r-tab').forEach((x) => x.classList.toggle('active', x === b));
        rFrame.src = b.dataset.src;
      };

      async function apiAct(type, payload = {}) {
        const tok = await ensureAdminToken();
        const res = await fetch('api/action', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(tok ? { 'X-Auth-Token': tok } : {}),
          },
          body: JSON.stringify({ type, payload }),
        });
        if (res.status === 401) {
          adminToken = '';
          sessionStorage.removeItem('salelisto:adminToken');
          const tok2 = await ensureAdminToken();
          const res2 = await fetch('api/action', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(tok2 ? { 'X-Auth-Token': tok2 } : {}),
            },
            body: JSON.stringify({ type, payload }),
          }).then((r) => r.json());
          if (!res2.ok) throw new Error(res2.error || 'Error en acción');
          return res2;
        }
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error en acción');
        return data;
      }

      function setStepUI(currentStep, htmlMsg, finished = false) {
        simStrip.hidden = false;
        document.querySelectorAll('.sim-step').forEach((el) => {
          const n = Number(el.dataset.step);
          el.classList.toggle('done', finished ? true : n < currentStep);
          el.classList.toggle('current', !finished && n === currentStep);
        });
        simMsg.innerHTML = htmlMsg;
      }

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      document.getElementById('simCloseBtn').onclick = () => {
        simStrip.hidden = true;
      };

      simBtn.onclick = async () => {
        const myRun = ++simRunId;
        simBtn.disabled = true;
        simBtn.textContent = '⚡ Simulando en vivo…';

        try {
          const tok = await ensureAdminToken();
          const st = await fetch('api/staff-state', {
            headers: tok ? { 'X-Auth-Token': tok } : {},
          }).then((r) => r.json());

          const availItems = (st.items || []).filter((i) => i.available);
          const kitchenItems = availItems.filter((i) => i.effectiveStation !== 'barra');
          const barItems = availItems.filter((i) => i.effectiveStation === 'barra');
          if (!kitchenItems.length || !barItems.length) {
            throw new Error('Se necesita al menos 1 plato de cocina y 1 bebida de barra disponibles');
          }

          const activeTables = (st.tables || []).filter((t) => t.active);
          const primaryTable = activeTables.find((t) => t.qrToken === tSel.value) || activeTables[0];
          const secondaryTable = activeTables.find((t) => t.id !== primaryTable.id && t.blockId !== primaryTable.blockId)
            || activeTables.find((t) => t.id !== primaryTable.id)
            || primaryTable;
          const callTable = activeTables.find((t) => t.id !== primaryTable.id && t.id !== secondaryTable.id) || secondaryTable;

          const dish1 = kitchenItems.find((i) => /ramen/i.test(i.name)) || kitchenItems[0];
          const dish2 = kitchenItems.find((i) => i.id !== dish1.id) || dish1;
          const drink1 = barItems.find((i) => /gin|yuzu/i.test(i.name)) || barItems[0];
          const drink2 = barItems.find((i) => i.id !== drink1.id) || drink1;

          // Paso 1: Pedido mixto en la mesa del cliente + pedido en otro sector
          setStepUI(1, `<strong>Paso 1/4:</strong> Mesa ${primaryTable.code} (${primaryTable.blockName}) pide platos y tragos por QR -&gt; se separan solos entre Cocina y Barra.`);
          const r1 = await apiAct('order.create', {
            qrToken: primaryTable.qrToken,
            items: [
              { itemId: dish1.id, qty: 2, note: '1 sin verdeo' },
              { itemId: drink1.id, qty: 2, note: 'Poco hielo' },
            ],
          });
          const r2 = secondaryTable.id !== primaryTable.id
            ? await apiAct('order.create', {
                qrToken: secondaryTable.qrToken,
                items: [
                  { itemId: dish2.id, qty: 1, note: '' },
                  { itemId: drink2.id, qty: 2, note: '' },
                ],
              })
            : null;

          const updatedTbl = (r1.state?.tables || []).find((t) => t.id === primaryTable.id);
          const assignedWid = updatedTbl?.waiterId;
          if (assignedWid && wSel.value !== assignedWid) {
            wSel.value = assignedWid;
            syncWaiter();
          }

          await wait(950);
          if (myRun !== simRunId) return;

          // Paso 2: Barra y Cocina marcan listos los retiros
          setStepUI(2, `<strong>Paso 2/4:</strong> Cocina y Barra marcan "¡Listo!" -&gt; se encienden los retiros por columna en la Estación de Mozos y vibra la pulsera.`);
          const createdPrimary = r1.result?.orderIds || [];
          for (const oid of createdPrimary) {
            await apiAct('order.status', { orderId: oid, status: 'listo' });
          }
          const createdSecondary = r2?.result?.orderIds || [];
          if (createdSecondary[0]) {
            await apiAct('order.status', { orderId: createdSecondary[0], status: 'listo' });
          }
          if (createdSecondary[1]) {
            await apiAct('order.status', { orderId: createdSecondary[1], status: 'cocina' });
          }

          await wait(950);
          if (myRun !== simRunId) return;

          // Paso 3: Llamado de atención en otra mesa del salón
          setStepUI(3, `<strong>Paso 3/4:</strong> Mesa ${callTable.code} toca "Llamar al mozo" (Agua / Hielo) -&gt; alerta inmediata en la columna de su mozo.`);
          await apiAct('call.create', {
            qrToken: callTable.qrToken,
            type: 'mozo',
            reason: 'Agua / Hielo',
          });

          await wait(950);
          if (myRun !== simRunId) return;

          // Paso 4: La mesa principal solicita la cuenta con Tarjeta + 10% propina
          setStepUI(4, `<strong>Paso 4/4:</strong> Mesa ${primaryTable.code} solicita la cuenta desde su QR con Tarjeta + 10% propina -&gt; importe exacto listo para cobrar en 1 solo viaje.`);
          await apiAct('call.create', {
            qrToken: primaryTable.qrToken,
            type: 'cuenta',
            payment: 'Tarjeta',
            tip: 10,
          });

          await wait(450);
          if (myRun !== simRunId) return;
          setStepUI(4, `<strong>✔ Hora pico activa en tiempo real:</strong> revisá el celular del cliente (Mesa ${primaryTable.code}), la app del mozo y las pestañas Pase / Cocina / Barra / Encargado.`, true);
        } catch (err) {
          setStepUI(1, `⚠️ ${err.message || 'No se pudo completar la simulación'}`);
        } finally {
          if (myRun === simRunId) {
            simBtn.disabled = false;
            simBtn.textContent = '⚡ Simular Hora Pico';
          }
        }
      };

      clearBtn.onclick = async () => {
        simRunId++;
        clearBtn.disabled = true;
        simBtn.disabled = false;
        simBtn.textContent = '⚡ Simular Hora Pico';
        try {
          await apiAct('data.clear_open_turn', {});
          simStrip.hidden = false;
          document.querySelectorAll('.sim-step').forEach((el) => el.classList.remove('done', 'current'));
          simMsg.innerHTML = '↺ <strong>Turno demo reiniciado:</strong> las mesas abiertas quedaron limpias conservando el historial cerrado del día.';
        } catch (err) {
          simStrip.hidden = false;
          simMsg.textContent = `⚠️ ${err.message}`;
        } finally {
          clearBtn.disabled = false;
        }
      };
    })();
  </script>
</body>
</html>
