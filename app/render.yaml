services:
  - type: web
    name: salelisto
    runtime: python
    buildCommand: ""
    startCommand: python server.py
    disk:
      name: salelisto-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: /var/data
      - key: TZ
        value: America/Argentina/Buenos_Aires
