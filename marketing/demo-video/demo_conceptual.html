<script>
// ============================================================ helpers
const ASSETS = '../../video-ad/v2/assets/';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
function bezier(x1, y1, x2, y2) {
  const bx = t => 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
  const by = t => 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { t = (lo + hi) / 2; if (bx(t) < x) lo = t; else hi = t; }
    return clamp(by(t));
  };
}
const ease = bezier(0.22, 1, 0.36, 1);          // curva maestra unica
const inout = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const A = (t, t0, d = 0.5) => ease(clamp((t - t0) / d));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, p) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * clamp(p))).join(',')})`; };
function op(e, o) { o = clamp(o); e.style.opacity = o.toFixed(4); e.style.visibility = o <= 0.002 ? 'hidden' : 'visible'; }
function set(e, o, x = 0, y = 0, s = 1) { op(e, o); e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(4)})`; }
const fmtARS = v => '$' + Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const INK = '#1c1917', ACC = '#d9412b', OK = '#2f8a57', KIT = '#d97706', BAR = '#6d28d9', LINE = '#e6dfd3';
// pulso de presion (1 -> 0.95 -> 1)
const press = (t, t0) => 1 - 0.05 * Math.sin(Math.PI * clamp((t - t0 + 0.04) / 0.26));
// anillo que se expande
function ring(e, t, t0, dur = 0.75, grow = 0.12) { const u = (t - t0) / dur; if (u < 0 || u > 1) { op(e, 0); return; } set(e, 0.85 * (1 - u), 0, 0, 1 + grow * ease(u)); }
// toque de dedo: lista de [t0, x, y]
function tapFx(e, t, evs) {
  for (const [t0, x, y] of evs) {
    const u = (t - t0 + 0.08) / 0.62;
    if (u >= 0 && u <= 1) {
      const o = u < 0.15 ? u / 0.15 : 1 - (u - 0.15) / 0.85;
      e.style.left = (x - 48) + 'px'; e.style.top = (y - 48) + 'px';
      set(e, o, 0, 0, 0.55 + 0.75 * ease(u)); return;

  op(e, 0);
}
// iconos
const CK = (s, c = '#fff', w = 3) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const PLUS = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="M24 15v18M15 24h18" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/></svg>`;
const CLOCK = c => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>`;
const PERSON = c => `<svg width="34" height="34" viewBox="0 0 24 24" fill="${c}"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.5c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>`;
const CARD = c => `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 9.5h19" /></svg>`;
const CASH = c => `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.8"/></svg>`;
const LEAF = c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10 10 5 20 4c0 9-5 15-13 15"/><path d="M5 19l7-7"/></svg>`;
const WHEAT = c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>`;

  ipa: `<svg width="62" height="62" viewBox="0 0 62 62"><rect width="62" height="62" rx="18" fill="#fde9cc"/><path d="M20 19h22l-3 29a3 3 0 0 1-3 3H26a3 3 0 0 1-3-3z" fill="#f0a234"/><path d="M18 19c0-5 5-7 9-4 2-3 8-3 10 0 4-2 8 1 7 4z" fill="#fff" stroke="#e2d4bf" stroke-width="1.5"/><path d="M26 25l1 18" stroke="#fbd28b" stroke-width="3" stroke-linecap="round"/></svg>`,
};
function fakeQR(n = 25, px = 300, seed0 = 7) {
  let seed = seed0; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const m = px / n; let s = '';
  const finder = (x, y) => { s += `<rect x="${x * m}" y="${y * m}" width="${7 * m}" height="${7 * m}" rx="${m * 1.6}" fill="${INK}"/><rect x="${(x + 1) * m}" y="${(y + 1) * m}" width="${5 * m}" height="${5 * m}" rx="${m}" fill="#ffffff"/><rect x="${(x + 2) * m}" y="${(y + 2) * m}" width="${3 * m}" height="${3 * m}" rx="${m * 0.7}" fill="${INK}"/>`; };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    const inC = x >= 9 && x <= 15 && y >= 9 && y <= 15;
    if (!inF && !inC && rnd() < 0.5) s += `<rect x="${(x * m + 0.8).toFixed(2)}" y="${(y * m + 0.8).toFixed(2)}" width="${(m - 1.6).toFixed(2)}" height="${(m - 1.6).toFixed(2)}" rx="2.4" fill="${INK}"/>`;
  }
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  return s;
}
// trazo que se dibuja
function drawable(p) { const L = p.getTotalLength(); p.style.strokeDasharray = `${L} ${L}`; return pr => { p.style.strokeDashoffset = (L * (1 - clamp(pr))).toFixed(2); op(p, pr > 0.001 ? 1 : 0); }; }
function dotOn(path, dot, u, o) { const L = path.getTotalLength(), q = path.getPointAtLength(L * clamp(u)); dot.setAttribute('cx', q.x.toFixed(2)); dot.setAttribute('cy', q.y.toFixed(2)); op(dot, o); }

// ============================================================ marcado de escenas

    <div class="abs" id="d4Stamp" style="left:32px;top:370px;width:536px;height:70px;border-radius:20px;background:${OK};color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:800;white-space:nowrap;box-shadow:0 16px 30px -10px rgba(47,138,87,0.7)">${CK(32, '#fff', 3.4)}Cobro resuelto en 1 solo viaje</div>
  </div>`;
}

// ============================================================ motor
let TL = null, FC = {}, M = {}, SC = {};
const R = {};
const IN_D = 0.48, OUT_D = 0.30;
const STEPS = ['Mesa QR', 'Cocina y Barra', 'Estación del Pase', 'Cuenta en 1 viaje'];
function sceneVis(s, t, opts = {}) {
  const pin = opts.noIn ? 1 : A(t, s.start + 0.02, IN_D);
  const pout = opts.noOut ? 0 : A(t, s.end - OUT_D - 0.02, OUT_D);
  const o = (t < s.end - 0.02 || opts.noOut) ? pin * (1 - pout) : 0;
  return { o: t < s.start && !opts.noIn ? 0 : o, dy: (1 - pin) * 16 - pout * 12 };
}
function build() {
  $('steps').innerHTML = STEPS.map((l, k) => `${k ? `<div class="conn"><i id="cn${k}"></i></div>` : ''}<div class="step"><div class="pill" id="sp${k}"></div>
    <div class="c" id="sc${k}"><span id="sn${k}">0${k + 1}</span>${CK(46, '#fff', 2.6).replace('<svg', `<svg id="sk${k}"`)}</div><div class="l" id="sl${k}">${l}</div></div>`).join('');
  $('stage').innerHTML = `<div class="scene" id="sD1">${buildD1()}</div><div class="scene" id="sD2">${buildD2()}</div><div class="scene" id="sD3">${buildD3()}</div><div class="scene" id="sD4">${buildD4()}</div>`;
  $('cCard').innerHTML = `
    <div class="it"><div class="ic" style="background:#fceae6"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="${ACC}" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></div><div class="v">salelisto.com</div></div>
    <div class="sep"></div>
    <div class="it"><div class="ic" style="background:#e3f3ea"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="${OK}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.5z"/></svg></div><div class="v">(+54)1138436571</div></div>
    <div class="sep"></div>
    <div class="it"><div class="ic" style="background:#fceae6"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="${ACC}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg></div><div class="v">ventas@salelisto.com</div></div>`;
  R.L = [$('L0'), $('L1')].map(l => ({ el: l, img: l.querySelector('img'), veil: l.querySelector('.veil'), warm: l.querySelector('.warm'), cream: l.querySelector('.cream') }));
  R.d1Arr = drawable($('d1Arr')); R.d2Ck = drawable($('d2Ck')); R.d2CkG = drawable($('d2CkG')); R.d2Cb = drawable($('d2Cb')); R.d2CbG = drawable($('d2CbG')); R.d4Arr = drawable($('d4Arr'));
  R.d3Slash = drawable($('d3Slash'));
}

// ------------------------------------------------------------ animacion por escena
function renderD1(t) {
  const pb = A(t, M.escanea - 0.1, 0.45);
  const brk = $('d1Brk');
  brk.setAttribute('stroke', mix('#d6cdc0', ACC, pb));
  brk.style.transform = `scale(${(1 + 0.05 * (1 - pb) * (pb > 0 ? 1 : 0)).toFixed(4)})`; brk.style.transformOrigin = '174px 174px';
  // haz de escaneo (2 pasadas)
  const ub = lin(t, M.qr1 - 0.30, M.qr1 + 0.90);
  const y = ub < 0.5 ? -40 + 300 * inout(ub * 2) : 260 - 300 * inout((ub - 0.5) * 2);
  set($('d1Beam'), ub > 0 && ub < 1 ? Math.min(1, Math.sin(Math.PI * ub) * 2.2) : 0, 0, y);
  const scanned = A(t, M.qr1 + 0.55, 0.4);
  set($('d1Hint'), 1 - scanned, 0, -8 * scanned); set($('d1Ok'), scanned, 0, 8 * (1 - scanned));
  const g = clamp(A(t, M.qr1 - 0.1, 0.35) - A(t, M.qr1 + 1.3, 0.8));
  $('d1Card').style.boxShadow = `0 0 0 ${(4 * g).toFixed(2)}px rgba(217,65,43,${(0.9 * g).toFixed(3)}), 0 18px 44px -14px rgba(28,25,23,0.18), 0 0 60px ${(10 * g).toFixed(1)}px rgba(217,65,43,${(0.18 * g).toFixed(3)})`;
  // flecha mesa -> carta
  const pa = A(t, M.qr1 + 0.35, 0.85);
  R.d1Arr(pa); op($('d1Head'), A(t, M.qr1 + 0.95, 0.25));
  const loop = t > M.qr1 + 1.2 ? ((t - M.qr1 - 1.2) / 1.6) % 1 : -1;
  if (loop >= 0) dotOn($('d1Arr'), $('d1Dot'), ease(loop), Math.sin(Math.PI * loop)); else dotOn($('d1Arr'), $('d1Dot'), pa, pa > 0 && pa < 1 ? 1 : 0);
  const pg = clamp(A(t, M.qr1 + 0.95, 0.3) - A(t, M.qr1 + 1.7, 0.7));
  $('d1Phone').style.boxShadow = `0 2px 0 1px #3a3330 inset, 0 30px 60px -18px rgba(28,25,23,0.55), 0 0 0 ${(6 * pg).toFixed(2)}px rgba(217,65,43,${(0.55 * pg).toFixed(3)})`;
  // seleccion de items
  const sel = [M.pide1, M.carta, M.carta + 0.62];
  let n = 0;
  sel.forEach((ts, k) => {
    const p = A(t, ts + 0.05, 0.35); if (t >= ts) n++;
    const it = $('d1It' + k);
    it.style.borderColor = mix('#ece5da', ACC, p); it.style.background = mix('#ffffff', '#fff6f3', p);
    it.style.transform = `scale(${press(t, ts).toFixed(4)})`;
    set($('d1Add' + k), 1 - p); set($('d1Chk' + k), p, 0, 0, 0.6 + 0.4 * p);
    ring($('d1Ring' + k), t, ts + 0.05, 0.7, 0.08);
  });
  const cnt = $('d1Cnt'); cnt.textContent = String(Math.max(1, n)); set(cnt, A(t, M.pide1 + 0.05, 0.3), 0, 0, 0.6 + 0.4 * A(t, M.pide1 + 0.05, 0.3));
  const tSend = M.apps + 0.38;
  const sent = A(t, tSend + 0.28, 0.35);
  set($('d1Send'), 1, 0, 0, press(t, tSend)); set($('d1Sent'), sent, 0, 0, press(t, tSend));
  const ur = lin(t, tSend, tSend + 0.55);
  set($('d1Rip'), ur > 0 && ur < 1 ? 0.9 * (1 - ur) : 0, 222 - 100, 666 - 100, 0.2 + 3.2 * ease(ur));
  tapFx($('d1Tap'), t, [[sel[0], 384, 252 + 53], [sel[1], 384, 370 + 53], [sel[2], 384, 488 + 53], [tSend, 260, 666]]);
  const pApps = A(t, M.apps, 0.45);
  set($('d1Apps'), pApps, 0, 18 * (1 - pApps), 0.9 + 0.1 * pApps);
}

function renderD2(t) {
  const pi = clamp(A(t, M.instante, 0.3) - A(t, M.instante + 0.6, 0.6));
  $('d2Tk').style.boxShadow = `0 0 0 ${(4 * pi).toFixed(2)}px rgba(217,65,43,${(0.8 * pi).toFixed(3)}), 0 18px 44px -14px rgba(28,25,23,0.18)`;
  [M.platos, M.platos + 0.15, M.bebidas, M.bebidas + 0.15].forEach((ts, k) => { const p = A(t, ts, 0.4); set($('d2Tag' + k), p, 12 * (1 - p)); });
  const ck = A(t, M.platos + 0.05, 0.85), cb = A(t, M.bebidas + 0.05, 0.55);
  R.d2Ck(ck); R.d2CkG(ck); R.d2Cb(cb); R.d2CbG(cb);
  const lk = t > M.cocina ? ((t - M.cocina) / 1.5) % 1 : -1, lb = t > M.barra ? ((t - M.barra) / 1.5) % 1 : -1;
  if (lk >= 0) dotOn($('d2Ck'), $('d2Dk'), ease(lk), Math.sin(Math.PI * lk)); else dotOn($('d2Ck'), $('d2Dk'), ck, ck > 0 && ck < 1 ? 1 : 0);
  if (lb >= 0) dotOn($('d2Cb'), $('d2Db'), ease(lb), Math.sin(Math.PI * lb)); else dotOn($('d2Cb'), $('d2Db'), cb, cb > 0 && cb < 1 ? 1 : 0);
  [['d2K', M.cocina, KIT, 135, M.cocina + 2.75], ['d2B', M.barra, BAR, 70, M.barra + 1.85]].forEach(([id, ton, col, t0s, tmk]) => {
    const on = A(t, ton - 0.05, 0.4);
    $(id + 'Hd').style.background = mix('#57534e', col, on);
    const box = $(id);
    box.style.boxShadow = `0 0 0 ${(5 * on).toFixed(2)}px ${col}55, 0 24px 60px -16px ${col}${Math.round(on * 140).toString(16).padStart(2, '0')}, 0 20px 40px -18px rgba(28,25,23,0.5)`;
    set($(id + 'Wait'), 1 - on);
    const tk = A(t, ton + 0.05, 0.5); set($(id + 'Tk'), tk, 0, -26 * (1 - tk));
    $(id + 'Tm').textContent = mmss(t0s + Math.max(0, Math.floor(t - ton)));
    const mk = A(t, tmk, 0.35), mkEl = $(id + 'Mk');
    mkEl.style.background = mix('#ffffff', OK, mk); mkEl.style.color = mix(OK, '#ffffff', mk);
    mkEl.querySelector('path').setAttribute('stroke', mix(OK, '#ffffff', mk));
    mkEl.style.boxShadow = `0 0 ${(30 * mk).toFixed(1)}px ${(4 * mk).toFixed(1)}px rgba(47,138,87,${(0.45 * mk).toFixed(3)})`;
    mkEl.style.transform = `scale(${(1 + 0.06 * Math.sin(Math.PI * clamp((t - tmk) / 0.4))).toFixed(4)})`;
  });
  const pe = A(t, M.errores, 0.45); set($('d2Ok'), pe, 0, 18 * (1 - pe), 0.9 + 0.1 * pe);
}

function renderD3(t) {
  // monitor centrado y luego se corre a la izquierda para la tarjeta de valor
  const mv = A(t, M.celulares - 0.45, 0.7);
  $('d3Mon').style.transform = `translateX(${(194 * (1 - mv)).toFixed(2)}px)`;
  const pv = A(t, M.celulares, 0.5); set($('d3Val'), pv, 40 * (1 - pv), 0);
  R.d3Slash(A(t, M.celulares + 0.3, 0.45));
  // caida de la tarjeta T4 en la columna de Martin
  const pd = A(t, M.sale - 0.05, 0.6);
  set($('d3T4'), pd, 0, -70 * (1 - pd));
  $('d3T6').style.transform = `translateY(${(214 * A(t, M.sale - 0.15, 0.5)).toFixed(2)}px)`;
  $('d3Ct1').textContent = t >= M.sale ? '2' : '1';
  const glow = clamp(A(t, M.sale + 0.1, 0.4) * (0.55 + 0.45 * Math.max(0, Math.sin(Math.PI * lin(t, M.mozo1, M.mozo1 + 0.9))))) * (1 - A(t, M.pase + 0.15, 0.4));
  op($('d3Glow'), glow);
  const hm = A(t, M.mozo1 - 0.05, 0.4);
  $('d3Ul1').style.background = mix('#3a332e', '#3fbf7a', hm); $('d3Nm1').style.color = mix('#faf7f2', '#7fe0a8', hm);
  $('d3Col1').style.background = mix('#24201d', '#1d2a22', hm);
  // toque unico en Entregado
  const tp = M.pase;
  const done = A(t, tp + 0.2, 0.4);
  $('d3Go').style.transform = `scale(${press(t, tp).toFixed(4)})`;
  $('d3Go').style.background = mix('#2f8a57', '#e3f3ea', done); $('d3Go').style.color = mix('#ffffff', '#2f8a57', done);
  $('d3Go').querySelector('path').setAttribute('stroke', mix('#ffffff', '#2f8a57', done));
  $('d3T4').style.borderColor = mix('#3fbf7a', '#2c5a40', done);
  const ur = lin(t, tp, tp + 0.5);
  set($('d3Rip'), ur > 0 && ur < 1 ? 0.9 * (1 - ur) : 0, 142 - 60, 148 - 60, 0.3 + 3 * ease(ur));
  tapFx($('d3Tap'), t, [[tp, 335 + 20 + 14 + 150, 82 + 84 + 148]]);
}

function renderD4(t) {
  const sw = A(t, M.qr2 - 0.05, 0.5);
  set($('d4A'), 1 - sw, -40 * sw); set($('d4B'), sw, 40 * (1 - sw));
  $('d4Ask').style.transform = `scale(${press(t, M.cuenta).toFixed(4)})`;
  const pc = A(t, M.pagar + 0.05, 0.35);
  const card = $('d4Card'); card.style.borderColor = mix(LINE, ACC, pc); card.style.background = mix('#ffffff', '#fff3f0', pc);
  card.style.transform = `scale(${press(t, M.pagar).toFixed(4)})`; set($('d4CardOk'), pc, 0, 0, 0.6 + 0.4 * pc);
  const tP = M.pagar + 0.8, pp = A(t, tP + 0.05, 0.35);
  const p10 = $('d4P10'); p10.style.borderColor = mix(LINE, ACC, pp); p10.style.background = mix('#ffffff', ACC, pp); p10.style.color = mix(INK, '#ffffff', pp);
  p10.style.transform = `scale(${press(t, tP).toFixed(4)})`;
  $('d4Tot').textContent = fmtARS(34200 + 3420 * inout(lin(t, tP + 0.05, tP + 0.65)));
  const tG = M.pagar + 1.65;
  const sent = A(t, tG + 0.25, 0.35);
  set($('d4Snd'), 1, 0, 0, press(t, tG)); set($('d4Sent'), sent, 0, 0, press(t, tG));
  tapFx($('d4Tap'), t, [[M.cuenta, 222, 666], [M.pagar, 119, 198], [tP, 251, 338], [tG, 222, 666]]);
  const pa = A(t, tG + 0.2, 0.75);
  R.d4Arr(pa); op($('d4Head'), A(t, tG + 0.7, 0.25));
  const pl = A(t, tG + 0.55, 0.4); set($('d4Lbl'), pl, 0, 10 * (1 - pl));
  const pdsp = A(t, SC.D4.start + 0.35, 0.6); set($('d4Disp'), pdsp, 36 * (1 - pdsp), 0);
  const w0 = A(t, M.cuenta + 0.1, 0.25), w1 = A(t, M.cuenta + 0.35, 0.4), bd = A(t, tG + 0.55, 0.45);
  set($('d4W0'), 1 - w0, 0, -12 * w0); set($('d4W1'), w1 * (1 - bd), 0, 12 * (1 - w1) - 12 * bd); set($('d4Body'), bd, 0, 14 * (1 - bd));
  const rb = lin(t, M.cuenta + 0.3, M.cuenta + 1.3);
  $('d4Bell').style.transform = `rotate(${(14 * Math.sin(rb * Math.PI * 6) * (1 - rb) * (rb > 0 && rb < 1 ? 1 : 0)).toFixed(2)}deg)`;
  const gl = clamp(A(t, M.viaje - 0.05, 0.3) - A(t, M.viaje + 0.5, 0.5));
  $('d4Disp').style.boxShadow = `0 0 0 ${(5 * gl).toFixed(2)}px rgba(47,138,87,${(0.6 * gl).toFixed(3)}), 0 18px 44px -14px rgba(28,25,23,0.18)`;
  const ps = A(t, M.viaje - 0.05, 0.4); set($('d4Stamp'), ps, 0, 0, 1.18 - 0.18 * ps);
}

function renderSteps(t) {
  const st = [SC.D1.start, SC.D2.start, SC.D3.start, SC.D4.start, SC.END.start];
  for (let k = 0; k < 4; k++) {
    const act = k === 0 ? 1 : A(t, st[k] - 0.15, 0.45);
    const done = A(t, st[k + 1] - 0.15, 0.45);
    $('sc' + k).style.background = done > 0 ? mix(ACC, OK, done) : mix('#ece6dc', ACC, act);
    $('sn' + k).style.color = mix('#8a8178', '#ffffff', act);
    op($('sn' + k), 1 - done); op($('sk' + k), done);
    $('sl' + k).style.color = done > 0 ? mix(INK, OK, done) : mix('#9a9188', INK, act);
    op($('sp' + k), act * (1 - done));
    if (k) $('cn' + k).style.width = (100 * act) + '%';
  }
}

const pending = [];
function setImg(img, src) {
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
  pending.push(img.decode().catch(() => {}));
}
function paintLayer(L, k, t) {
  const s = TL.scenes[k];
  const n = FC[s.id] || 1;
  const i = Math.max(1, Math.min(n, Math.floor((t - s.start + TL.pre) * TL.srcFps) + 1));
  setImg(L.img, `${TL.frameBase}/${s.id}/f_${String(i).padStart(4, '0')}.jpg`);
  const nx = TL.scenes[k + 1];
  const a = s.start - (k > 0 ? s.xfade / 2 : 0), b = s.end + (nx ? nx.xfade / 2 : 0);
  const q = lin(t, a, b);
  const closing = !!s.closing;
  L.img.style.transform = `scale(${((closing ? 1.08 : 1.0) * (1 + 0.03 * q)).toFixed(5)})`;
  L.img.style.filter = closing ? 'blur(14px)' : 'none';
  L.veil.style.display = closing ? 'none' : 'block';
  L.warm.style.display = closing ? 'none' : 'block';
  L.veil.style.background = `rgba(28, 25, 23, ${s.veil || 0.5})`;
  L.cream.style.display = closing ? 'block' : 'none';
}

window.renderFrame = async function (f) {
  pending.length = 0;
  const t = f / TL.fps;
  const sc = TL.scenes;
  let i = 0; for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) i = k;
  let tr = null;
  for (let k = 1; k < sc.length; k++) {
    const a = sc[k].start - sc[k].xfade / 2, b = sc[k].start + sc[k].xfade / 2;
    if (t >= a && t < b) tr = { from: k - 1, to: k, p: (t - a) / (b - a) };
  }
  if (tr) {
    paintLayer(R.L[0], tr.from, t); paintLayer(R.L[1], tr.to, t);
    R.L[0].el.style.opacity = 1; R.L[1].el.style.opacity = tr.p.toFixed(4); R.L[1].el.style.display = 'block';
  } else {
    paintLayer(R.L[0], i, t); R.L[0].el.style.opacity = 1; R.L[1].el.style.display = 'none';
  }
  // barra + escenario: visibles desde el cuadro 0, salen hacia el cierre
  const END = SC.END, e6 = END.start;
  const cfade = lin(t, e6 - END.xfade / 2, e6 + END.xfade / 2 - 0.1), cout = A(t, e6 - END.xfade / 2, 0.6);
  set($('stage'), 1 - cfade, 0, -cout * 14, 1 - 0.015 * cout);
  set($('top'), 1 - cfade, 0, -cout * 10);
  const diag = sc.filter(s => !s.closing);
  diag.forEach((s, k) => {
    const v = sceneVis(s, t, { noIn: k === 0, noOut: k === diag.length - 1 });
    set($('s' + s.id), v.o, 0, v.dy);
  });
  renderSteps(t);
  if (t < SC.D2.start + 0.1) renderD1(t);
  if (t > SC.D2.start - 0.1 && t < SC.D3.start + 0.1) renderD2(t);
  if (t > SC.D3.start - 0.1 && t < SC.D4.start + 0.1) renderD3(t);
  if (t > SC.D4.start - 0.1) renderD4(t);
  // cierre
  $('closing').style.display = t >= e6 - 0.3 ? 'block' : 'none';
  const pl = A(t, M.logo, 0.6), ph = A(t, M.cta - 0.15, 0.6), pb = A(t, M.personalizada, 0.55), pc = A(t, M.personalizada + 0.5, 0.6);
  set($('cLogo'), pl, 0, 16 * (1 - pl), 0.96 + 0.04 * pl); set($('cHead'), ph, 0, 16 * (1 - ph));
  set($('cBadge'), pb, 0, 16 * (1 - pb)); set($('cCard'), pc, 0, 16 * (1 - pc));
  await Promise.all(pending);
  return true;
};
window.init = async function (tl, fc) {
  TL = tl; FC = fc; M = tl.marks;
  tl.scenes.forEach(s => { SC[s.id] = s; });
  build();
  await document.fonts.ready;
  await Promise.all([700, 800].map(w => document.fonts.load(`${w} 40px PJS`)));
  await Promise.all([...document.querySelectorAll('img')].filter(i => i.src).map(i => i.decode().catch(() => {})));
  await new Promise(r => setTimeout(r, 300));
  return true;
};
