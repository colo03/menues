<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SaleListo · Render de pieza</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{background:transparent}#root{display:inline-block}</style>
</head>
<body>
<div id="root"></div>
<script src="pieces.js"></script>
<script>
  // Uso: render.html?p=c1s1  (ids en pieces.js)
  const id = new URLSearchParams(location.search).get('p') || 'c1s1';
  const piece = window.PIECES[id];
  document.getElementById('root').innerHTML = piece ? piece.html() : '<p style="font:24px sans-serif;padding:40px">Pieza inexistente: ' + id + '</p>';

  // Auditoría de desbordes: devuelve elementos con texto que sale del lienzo o de su caja.
  window.audit = () => {
    const cv = document.querySelector('.cv'); if (!cv) return ['sin lienzo'];
    const R = cv.getBoundingClientRect(); const issues = [];
    cv.querySelectorAll('*').forEach(el => {
      const r = el.getBoundingClientRect(); if (!r.width || !r.height) return;
      if (el.closest('svg') && el.tagName.toLowerCase() !== 'svg') return;
      if (r.left < R.left - 0.5 || r.top < R.top - 0.5 || r.right > R.right + 0.5 || r.bottom > R.bottom + 0.5) {
        if (el.closest('.band') || el.closest('[data-bleed]')) return;
        issues.push(`fuera del lienzo: <${el.tagName.toLowerCase()}> "${(el.textContent || '').trim().slice(0, 40)}" [${Math.round(r.left)},${Math.round(r.top)},${Math.round(r.right)},${Math.round(r.bottom)}]`);
      }
      if (el.children.length === 0 && el.textContent.trim() && el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow !== 'visible') {
        issues.push(`texto recortado: "${el.textContent.trim().slice(0, 40)}"`);
      }
    });
    return issues;
  };
</script>
</body>
</html>
