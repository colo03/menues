<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SaleListo Ad v5 · Sin celulares en el salón</title>
<style>
@font-face { font-family: 'PJS'; src: url('../assets/fonts/PJS-700.ttf'); font-weight: 700; }
@font-face { font-family: 'PJS'; src: url('../assets/fonts/PJS-800.ttf'); font-weight: 800; }
/* Tokens oficiales: branding/tokens.css (Propuesta 01 · Pase Limpio) */
:root {
  --bg: #faf7f2; --surface: #ffffff; --line: #e6dfd3; --ink: #1c1917; --accent: #d9412b; --accent-soft: #fceae6;
  --ok: #2f8a57; --ok-soft: #e3f3ea;
  --shadow-float: 0 4px 12px rgba(28, 25, 23, 0.06), 0 20px 48px -8px rgba(28, 25, 23, 0.14);
  --shadow-card: 0 1px 2px rgba(28, 25, 23, 0.04), 0 8px 24px -4px rgba(28, 25, 23, 0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1c1917; }
body { font-family: 'PJS', sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); }
#vp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1c1917; }
.abs { position: absolute; }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
.layer img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
.layer .veil { position: absolute; inset: 0; background: rgba(28, 25, 23, 0.46); }
.layer .cream { position: absolute; inset: 0; background: rgba(250, 247, 242, 0.90); }
/* Titular unico: 2 o 3 palabras, una linea */
.title { position: absolute; left: 60px; top: 486px; width: 960px; text-align: center; color: #faf7f2; font-weight: 800; font-size: 88px; line-height: 1.1; letter-spacing: -0.03em; white-space: nowrap; text-shadow: 0 2px 22px rgba(28,25,23,0.35); }
.title .k { background: #d9412b; color: #faf7f2; border-radius: 16px; padding: 0 0.16em 0.04em; text-shadow: none; }
/* Lienzo blanco persistente 720x720 */
#card { position: absolute; left: 180px; top: 660px; width: 720px; height: 720px; background: var(--surface); border-radius: 36px; box-shadow: var(--shadow-float); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; }
#stage text { font-family: 'PJS', sans-serif; }
/* Cierre */
#closing { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#closing .logo { position: absolute; left: 170px; top: 610px; width: 740px; height: 198px; object-fit: contain; }
#closing .badge { position: absolute; left: 0; top: 880px; width: 1080px; display: flex; justify-content: center; }
#closing .badge span { display: inline-flex; align-items: center; height: 84px; padding: 0 42px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 2px solid #f5c9bf; font-size: 42px; font-weight: 800; letter-spacing: -0.01em; }
#closing .ccard { position: absolute; left: 150px; top: 1030px; width: 780px; height: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow-card); }
#closing .row { position: absolute; left: 44px; height: 80px; display: flex; align-items: center; gap: 24px; }
#closing .row .ic { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
#closing .row .v { font-size: 44px; font-weight: 800; color: var(--ink); letter-spacing: -0.015em; white-space: nowrap; }
</style>
</head>
<body>
<div id="vp">
  <div id="bg">
    <div class="layer" id="L0"><img><div class="veil"></div><div class="cream"></div></div>
    <div class="layer" id="L1"><img><div class="veil"></div><div class="cream"></div></div>
  </div>
  <div id="titles"></div>

  <div id="closing">
    <img class="logo" id="cLogo" src="../assets/logo.svg" alt="SaleListo">

    <div class="ccard" id="cCta">
      <div class="row" style="top:40px">
        <div class="ic" style="background:#e3f3ea"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2f8a57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.5z"/></svg></div>
        <div class="v">(+54)1138436571</div>
      </div>
      <div class="abs" style="left:44px;top:129px;width:692px;height:2px;background:#e6dfd3"></div>
      <div class="row" style="top:140px">
        <div class="ic" style="background:#fceae6"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d9412b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg></div>
        <div class="v">ventas@salelisto.com</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
// Curva maestra unica: cubic-bezier(0.22, 1, 0.36, 1), sin rebote
function bezier(x1, y1, x2, y2) {
  const bx = t => 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
  const by = t => 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { t = (lo + hi) / 2; if (bx(t) < x) lo = t; else hi = t; }
    return clamp(by(t));
  };
}
const ease = bezier(0.22, 1, 0.36, 1);
const inout = x => { x = clamp(x); return x * x * (3 - 2 * x); };   // solo para recorridos sobre curvas (sin rebote)
const A = (t, t0, d = 0.5) => ease(clamp((t - t0) / d));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, p) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * clamp(p))).join(',')})`; };
function op(e, o) { o = clamp(o); e.style.opacity = o.toFixed(4); e.style.visibility = o <= 0.002 ? 'hidden' : 'visible'; }
function show(e, o, dy = 0) { op(e, o); e.style.transform = `translateY(${dy.toFixed(2)}px)`; }
function vis(g, o, dy = 0) { op(g, o); g.setAttribute('transform', `translate(0 ${dy.toFixed(2)})`); }
function place(g, x, y, s = 1, o = 1) { g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(4)})`); op(g, o); }

const INK = '#1c1917', MUTE = '#d6cdc0', ACC = '#d9412b', OK = '#2f8a57', KIT = '#d97706', BAR = '#6d28d9';
const ST = `fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"`;

// ============================================================ iconos vectoriales propios (centrados en 0,0)
const ICON = {
  // campana de servicio sobre bandeja (~184 px)
  cloche: `<g ${ST} stroke="${INK}">
    <path d="M-72 28 A72 72 0 0 1 72 28 Z" fill="#ffffff"/>
    <path d="M-92 46 H92"/>
    <circle cx="0" cy="-54" r="9" fill="#ffffff"/>
    <path d="M-40 4 A46 46 0 0 1 -16 -22" stroke="${MUTE}"/></g>`,
  // hamburguesa (~136 x 130 px)
  burger: `<g ${ST} stroke="${INK}">
    <path d="M-64 -8 C-64 -50 -36 -64 0 -64 C36 -64 64 -50 64 -8 Z" fill="#fef1dc"/>
    <path d="M-68 8 Q-57 -2 -45 8 T-22 8 T0 8 T22 8 T45 8 T68 8" stroke="${OK}"/>
    <rect x="-64" y="18" width="128" height="22" rx="11" fill="#57534e"/>
    <path d="M-62 48 H62 V52 C62 62 54 66 42 66 H-42 C-54 66 -62 62 -62 52 Z" fill="#fef1dc"/></g>
    <g fill="${INK}"><circle cx="-22" cy="-38" r="3.5"/><circle cx="0" cy="-47" r="3.5"/><circle cx="22" cy="-38" r="3.5"/></g>`,
  // copa / trago (~120 x 128 px)
  glass: `<path d="M-41 -36 H41 C37 -8 22 2 0 2 C-22 2 -37 -8 -41 -36 Z" fill="#efeafe"/>
    <g ${ST} stroke="${INK}">
    <path d="M-46 -62 H46 C46 -12 26 6 0 6 C-26 6 -46 -12 -46 -62 Z"/>
    <path d="M0 6 V54"/><path d="M-32 60 H32"/>
    <circle cx="38" cy="-64" r="16" fill="#fef1dc"/><path d="M38 -64 L38 -78 M38 -64 L50 -56 M38 -64 L26 -56"/></g>`,
  // olla con vapor (color heredado)
  pot: `<g ${ST} stroke="currentColor">
    <path d="M-44 -6 H44 V22 C44 34 36 40 24 40 H-24 C-36 40 -44 34 -44 22 Z"/>
    <path d="M-44 4 H-56 M44 4 H56"/><path d="M-50 -16 H50"/><path d="M-10 -26 H10"/>
    <path d="M-18 -40 q-7 -9 0 -18 M0 -40 q-7 -9 0 -18 M18 -40 q-7 -9 0 -18" stroke-width="3.5"/></g>`,
  // copa simple de barra (color heredado)
  cup: `<g ${ST} stroke="currentColor">
    <path d="M-34 -46 H34 C34 -8 20 4 0 4 C-20 4 -34 -8 -34 -46 Z"/>
    <path d="M-30 -26 H30" stroke-width="3.5"/>
    <path d="M0 4 V38"/><path d="M-24 44 H24"/></g>`,
  // comanda (blanca, sobre nodo bermellon)
  ticket: `<g ${ST} stroke="#ffffff" stroke-width="3.5"><path d="M-17 -22 H17 V22 L11 17 L5 22 L0 17 L-5 22 L-11 17 L-17 22 Z"/><path d="M-8 -9 H8 M-8 2 H8"/></g>`,
  // mozo (blanco)
  person: `<g fill="#ffffff"><circle cx="0" cy="-9" r="10"/><path d="M-19 21 C-19 6 -10 1 0 1 C10 1 19 6 19 21 Z"/></g>`,
  alert: c => `<circle r="36" fill="${c}"/><path d="M0 -15 V5" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/><circle cy="17" r="4.5" fill="#ffffff"/>`,
  check: (s, w) => `<path d="M${-0.42 * s} ${0.02 * s} L${-0.12 * s} ${0.32 * s} L${0.44 * s} ${-0.3 * s}" fill="none" stroke="#ffffff" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`,
};

// ============================================================ QR ilustrativo (sin URL)
function fakeQR(n = 25, px = 300) {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const m = px / n; let s = '';
  const finder = (x, y) => { s += `<rect x="${x * m}" y="${y * m}" width="${7 * m}" height="${7 * m}" rx="${m * 1.6}" fill="${INK}"/><rect x="${(x + 1) * m}" y="${(y + 1) * m}" width="${5 * m}" height="${5 * m}" rx="${m}" fill="#ffffff"/><rect x="${(x + 2) * m}" y="${(y + 2) * m}" width="${3 * m}" height="${3 * m}" rx="${m * 0.7}" fill="${INK}"/>`; };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    const inC = x >= 9 && x <= 15 && y >= 9 && y <= 15;
    if (!inF && !inC && rnd() < 0.5) s += `<rect x="${(x * m + 0.8).toFixed(2)}" y="${(y * m + 0.8).toFixed(2)}" width="${(m - 1.6).toFixed(2)}" height="${(m - 1.6).toFixed(2)}" rx="2.4" fill="${INK}"/>`;
  }
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  return s;
}

// ============================================================ construccion del lienzo
let TL = null, FC = {}, S = {}, M = {};
const R = {};
const g = (html, attrs = '') => `<g ${attrs}>${html}</g>`;
function build() {
  // titulares
  const tw = $('titles');
  TL.scenes.forEach(s => {
    if (!s.title) return;
    const d = document.createElement('div'); d.className = 'title'; d.id = 't' + s.id;
    d.innerHTML = s.title.split('|').map((p, i) => i % 2 ? `<span class="k">${p}</span>` : p).join('');
    tw.appendChild(d);
  });

  const C = 360;
  // ---------- E01: alertas -> calma
  const AL = [[128, 136, ACC], [592, 136, KIT], [360, 626, ACC]];
  let s1 = '';
  AL.forEach((a, k) => {
    const dx = C - a[0], dy = C - a[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    s1 += `<path id="e1l${k}" d="M${(a[0] + ux * 52).toFixed(1)} ${(a[1] + uy * 52).toFixed(1)} L${(C - ux * 138).toFixed(1)} ${(C - uy * 138).toFixed(1)}" stroke="${MUTE}" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 14" fill="none"/>`;
  });
  AL.forEach((a, k) => {
    s1 += `<g id="e1a${k}"><circle id="e1p${k}" r="36" fill="none" stroke="${a[2]}" stroke-width="3"/><g id="e1b${k}">${ICON.alert(a[2])}</g></g>`;
  });
  s1 += `<circle id="e1bgc" cx="${C}" cy="${C}" r="122" fill="#f3eee6"/>`;
  s1 += `<g id="e1clo">${ICON.cloche}</g>`;
  s1 += `<g id="e1mark"><image href="../assets/mark.svg" x="-78" y="-78" width="156" height="156"/></g>`;
  s1 += `<circle id="e1ring" cx="${C}" cy="${C}" r="146" fill="none" stroke="${OK}" stroke-width="4" stroke-linecap="round" transform="rotate(-90 ${C} ${C})"/>`;
  s1 += `<g id="e1ok"><circle r="32" fill="${OK}"/>${ICON.check(40, 6)}</g>`;

  // ---------- E02: QR 4G -> carta -> Pedir
  let s2 = `<g id="e2qr">
      <rect x="184" y="214" width="352" height="352" rx="32" fill="#ffffff" stroke="#e6dfd3" stroke-width="3"/>
      <g transform="translate(210 240)">${fakeQR()}</g>
      <rect x="320" y="350" width="80" height="80" rx="18" fill="#ffffff"/>
      <image href="../assets/mark.svg" x="328" y="358" width="64" height="64"/>
      <g id="e2scan"><rect x="190" y="-14" width="340" height="28" rx="14" fill="${ACC}" opacity="0.16"/><rect x="190" y="-3" width="340" height="6" rx="3" fill="${ACC}"/></g>
    </g>
    <g id="e2pill"><rect x="-74" y="-36" width="148" height="72" rx="36" fill="${OK}"/><text x="0" y="14" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">4G</text></g>
    <g id="e2food">
      <circle cx="232" cy="300" r="112" fill="#fef1dc" opacity="0.6"/><g transform="translate(232 300)">${ICON.burger}</g>
      <circle cx="488" cy="300" r="112" fill="#efeafe" opacity="0.7"/><g transform="translate(488 304)">${ICON.glass}</g>
    </g>
    <circle id="e2rip0" cx="${C}" cy="560" r="60" fill="none" stroke="${ACC}" stroke-width="4"/>
    <circle id="e2rip1" cx="${C}" cy="560" r="60" fill="none" stroke="${ACC}" stroke-width="4"/>
    <g id="e2btn"><rect x="-170" y="-56" width="340" height="112" rx="56" fill="${ACC}"/><text x="0" y="16" text-anchor="middle" font-size="46" font-weight="800" fill="#ffffff">Pedir</text>
      <circle id="e2dot" cx="112" cy="14" r="20" fill="#ffffff"/></g>`;

  // ---------- E03: comanda -> Cocina / Barra
  const P3 = [`M${C} 168 C${C} 300 170 300 170 462`, `M${C} 168 C${C} 300 550 300 550 462`];
  let s3 = `<path id="e3c0" d="${P3[0]}" fill="none" stroke="${MUTE}" stroke-width="4" stroke-linecap="round"/>
    <path id="e3c1" d="${P3[1]}" fill="none" stroke="${MUTE}" stroke-width="4" stroke-linecap="round"/>`;
  [['Cocina', 170, KIT, '#fef1dc', ICON.pot], ['Barra', 550, BAR, '#efeafe', ICON.cup]].forEach((b, k) => {
    s3 += `<g id="e3box${k}"><rect id="e3r${k}" x="${b[1] - 125}" y="462" width="250" height="208" rx="32" fill="#faf7f2" stroke="#e6dfd3" stroke-width="3"/>
      <g id="e3i${k}" transform="translate(${b[1]} 540)" style="color:#a8a29e">${b[4]}</g>
      <text id="e3t${k}" x="${b[1]}" y="638" text-anchor="middle" font-size="38" font-weight="800" fill="#a8a29e">${b[0]}</text></g>`;
  });
  s3 += `<g id="e3node"><circle cx="${C}" cy="118" r="52" fill="${ACC}"/><g transform="translate(${C} 118)">${ICON.ticket}</g></g>`;
  s3 += `<g id="e3m0"><g transform="scale(0.78)">${ICON.burger}</g></g><g id="e3m1"><g transform="scale(0.78)">${ICON.glass}</g></g>`;

  // ---------- E04: 3 mozos -> 3 sectores parejos
  const COLS = [['Interior', 150, ACC, '#fceae6'], ['Terraza', 360, OK, '#e3f3ea'], ['Barra', 570, BAR, '#efeafe']];
  let s4 = '';
  COLS.forEach((c, k) => {
    s4 += `<rect id="e4col${k}" x="${c[1] - 96}" y="262" width="192" height="300" rx="30" fill="#faf7f2" stroke="#e6dfd3" stroke-width="3"/>`;
    s4 += `<circle id="e4slot${k}" cx="${c[1]}" cy="196" r="42" fill="none" stroke="${MUTE}" stroke-width="3" stroke-dasharray="7 9"/>`;
    for (let j = 0; j < 4; j++) {
      const x = c[1] + (j % 2 ? 40 : -40), y = 366 + Math.floor(j / 2) * 92;
      s4 += `<rect id="e4t${k}${j}" x="${x - 32}" y="${y - 32}" width="64" height="64" rx="15" fill="#ffffff" stroke="${MUTE}" stroke-width="3.5"/>`;
    }
    s4 += `<text x="${c[1]}" y="634" text-anchor="middle" font-size="36" font-weight="800" fill="${INK}">${c[0]}</text>`;
  });
  COLS.forEach((c, k) => { s4 += `<g id="e4m${k}"><circle r="40" fill="${c[2]}"/>${ICON.person}</g>`; });

  // ---------- E05: sin celulares en el salon -> estacion del Pase + Pulsera vibradora
  const PX = 180, BX = 540, CY = 318;
  const WCOL = [ACC, OK, BAR];
  let s5 = `<path id="e5div" d="M${C} 130 V610" stroke="#ece6dc" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  // mitad izquierda: pantalla horizontal fija del pase con 3 columnas (una por mozo)
  s5 += `<g id="e5pase" transform="translate(${PX} ${CY})">
      <path d="M0 95 V130 M-54 134 H54" ${ST} stroke="${INK}"/>
      <rect x="-140" y="-95" width="280" height="190" rx="22" fill="#ffffff" stroke="${INK}" stroke-width="4"/>
      <rect x="-124" y="-79" width="248" height="158" rx="12" fill="#faf7f2"/>
      ${WCOL.map((c, k) => { const x = -112 + k * 78; return `<g>
        <rect id="e5col${k}" x="${x}" y="-67" width="68" height="134" rx="12" fill="#ede7dd"/>
        <circle id="e5av${k}" cx="${x + 34}" cy="-40" r="13" fill="#ffffff"/>
        <rect id="e5tk${k}0" x="${x + 12}" y="-12" width="44" height="16" rx="6" fill="#ffffff"/>
        <rect id="e5tk${k}1" x="${x + 12}" y="14" width="44" height="16" rx="6" fill="#ffffff"/></g>`; }).join('')}
    </g>
    <text id="e5lp" x="${PX}" y="590" text-anchor="middle" font-size="38" font-weight="800" fill="${INK}">Pase</text>`;
  // mitad derecha: pulsera inteligente de frente (malla + capsula), ondas laterales y tilde al salir
  s5 += `<g transform="translate(${BX} ${CY})">
      <g id="e5waves">
        ${[0, 1].map(k => [1, -1].map(sd => `<path class="e5w${k}" d="M${sd * (88 + k * 30)} ${-48 - k * 22} Q${sd * (110 + k * 36)} 0 ${sd * (88 + k * 30)} ${48 + k * 22}" fill="none" stroke="${OK}" stroke-width="4" stroke-linecap="round"/>`).join('')).join('')}
      </g>
      <g id="e5band">
        <path d="M-38 -90 L-33 -186 Q-32 -194 -24 -194 H24 Q32 -194 33 -186 L38 -90 Z" fill="#ece6dc" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
        <path d="M-38 90 L-33 186 Q-32 194 -24 194 H24 Q32 194 33 186 L38 90 Z" fill="#ece6dc" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
        <path d="M-24 -116 H24 M-23 -138 H23 M-22 -160 H22" stroke="${MUTE}" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        ${[118, 142, 166].map(y => `<circle cx="0" cy="${y}" r="5" fill="${MUTE}"/>`).join('')}
        <rect x="-62" y="-98" width="124" height="196" rx="62" fill="${INK}"/>
        <rect id="e5scr" x="-47" y="-80" width="94" height="160" rx="47" fill="#2b2623"/>
        <g id="e5dots">${[-18, 0, 18].map(x => `<circle cx="${x}" cy="0" r="6" fill="#6b625b"/>`).join('')}</g>
        <path id="e5chk" d="M-23 2 L-7 18 L24 -16" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text id="e5lb" x="${BX}" y="590" text-anchor="middle" font-size="38" font-weight="800" fill="${INK}">Pulsera</text>`;

  $('stage').innerHTML = g(s1, 'id="gE01"') + g(s2, 'id="gE02"') + g(s3, 'id="gE03"') + g(s4, 'id="gE04"') + g(s5, 'id="gE05"');

  R.e1lines = [0, 1, 2].map(k => $('e1l' + k));
  R.ring = $('e1ring'); R.ringL = 2 * Math.PI * 146; R.ring.style.strokeDasharray = `${R.ringL} ${R.ringL}`;
  R.cn = [0, 1].map(k => { const p = $('e3c' + k), L = p.getTotalLength(); p.style.strokeDasharray = `${L} ${L}`; return { p, L }; });
  R.chk = $('e5chk'); R.chkL = R.chk.getTotalLength(); R.chk.style.strokeDasharray = `${R.chkL} ${R.chkL}`;
  R.AL = AL; R.COLS = COLS;
  R.L = [$('L0'), $('L1')].map(l => ({ el: l, img: l.querySelector('img'), veil: l.querySelector('.veil'), cream: l.querySelector('.cream') }));
}

// ============================================================ fondo
const pending = [];
function setImg(img, src) {
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
  pending.push(img.decode().catch(() => {}));
}
function paintLayer(L, k, t) {
  const s = TL.scenes[k];
  const n = FC[s.id] || 1;
  const i = Math.max(1, Math.min(n, Math.floor((t - s.start + TL.pre) * TL.srcFps) + 1));
  setImg(L.img, `../build/frames_src/${s.id}/f_${String(i).padStart(4, '0')}.jpg`);
  const nx = TL.scenes[k + 1];
  const a = s.start - (k > 0 ? s.xfade / 2 : 0), b = s.end + (nx ? nx.xfade / 2 : 0);
  const q = lin(t, a, b);                                  // deriva lineal 3 %
  const closing = s.id === 'E06';
  const base = closing ? 1.08 : 1.0;
  L.img.style.transform = `scale(${(base * (1 + 0.03 * q)).toFixed(5)})`;
  L.img.style.filter = closing ? 'blur(12px)' : 'none';
  L.veil.style.display = closing ? 'none' : 'block';
  L.cream.style.display = closing ? 'block' : 'none';
}

// ============================================================ ventanas por escena (relevo secuencial, nunca dos textos a la vez)
const IN_D = 0.48, OUT_D = 0.30;
function sceneVis(s, t, opts = {}) {
  const tin = opts.tin ?? s.start + 0.02;
  const pin = opts.noIn ? 1 : A(t, tin, IN_D);
  const pout = opts.noOut ? 0 : A(t, s.end - OUT_D - 0.02, OUT_D);
  const o = (t < s.end - 0.02 || opts.noOut) ? pin * (1 - pout) : 0;
  return { o, dy: (1 - pin) * 14 - pout * 10 };
}

// ============================================================ render
window.renderFrame = async function (f) {
  pending.length = 0;
  const t = f / TL.fps;
  const sc = TL.scenes;
  let i = 0; for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) i = k;

  // --- fondo: crossfade 0.48 s entre B-rolls
  let tr = null;
  for (let k = 1; k < sc.length; k++) {
    const a = sc[k].start - sc[k].xfade / 2, b = sc[k].start + sc[k].xfade / 2;
    if (t >= a && t < b) tr = { from: k - 1, to: k, p: (t - a) / (b - a) };
  }
  if (tr) {
    paintLayer(R.L[0], tr.from, t); paintLayer(R.L[1], tr.to, t);
    R.L[0].el.style.opacity = 1; R.L[1].el.style.opacity = tr.p.toFixed(4); R.L[1].el.style.display = 'block';
  } else {
    paintLayer(R.L[0], i, t); R.L[0].el.style.opacity = 1; R.L[1].el.style.display = 'none';
  }

  // --- titulares
  sc.forEach(s => {
    const e = $('t' + s.id); if (!e) return;
    const v = sceneVis(s, t, s.id === 'E01' ? { tin: 0.10 } : {});
    show(e, v.o, v.dy);
  });

  // --- lienzo blanco: entra una vez, se mantiene anclado, sale hacia el cierre
  const e6 = S.E06.start;
  const cin = A(t, 0.24, 0.65), cfade = lin(t, e6 - S.E06.xfade / 2, e6 + S.E06.xfade / 2), cout = A(t, e6 - S.E06.xfade / 2, 0.60);
  show($('card'), cin * (1 - cfade), (1 - cin) * 18 - cout * 10);
  ['E01', 'E02', 'E03', 'E04', 'E05'].forEach(id => {
    const v = sceneVis(S[id], t, id === 'E01' ? { noIn: true } : id === 'E05' ? { noOut: true } : {});
    vis($('g' + id), v.o, v.dy);
  });

  // ================= E01: alertas alrededor del mozo -> isotipo + anillo verde
  {
    const C = 360, ok = M.e1_ok;
    const off = A(t, ok, 0.42);
    R.AL.forEach((a, k) => {
      const pin = A(t, 0.55 + 0.32 * k, 0.5);
      const o = pin * (1 - off);
      const breathe = 1 + 0.035 * Math.sin((t - 0.55 - 0.32 * k) * Math.PI * 2 / 1.5) * (t > 0.55 + 0.32 * k ? 1 : 0);
      place($('e1a' + k), a[0], a[1], (0.82 + 0.18 * pin) * (1 - 0.3 * off), o);
      $('e1b' + k).setAttribute('transform', `scale(${breathe.toFixed(4)})`);
      const ph = ((t - 0.75 - 0.32 * k) % 1.5 + 1.5) % 1.5 / 1.5;
      const p = $('e1p' + k); p.setAttribute('r', (36 + 30 * ease(ph)).toFixed(2)); p.style.opacity = (t > 0.75 + 0.32 * k ? 0.55 * (1 - ph) : 0).toFixed(3);
      const ln = R.e1lines[k]; op(ln, A(t, 0.70 + 0.32 * k, 0.5) * (1 - off)); ln.style.strokeDashoffset = (-t * 26).toFixed(2);
    });
    const pc = A(t, ok, 0.32);
    place($('e1clo'), C, C + 6, 1 - 0.1 * pc, 1 - pc);
    const pm = A(t, ok + 0.18, 0.55);
    place($('e1mark'), C, C, 0.86 + 0.14 * pm, pm);
    $('e1bgc').setAttribute('fill', mix('#f3eee6', '#ffffff', pm));
    const pr = A(t, ok + 0.36, 0.75);
    R.ring.style.strokeDashoffset = (R.ringL * (1 - pr)).toFixed(2); op(R.ring, pr > 0 ? 1 : 0);
    const pk = A(t, ok + 0.86, 0.45);
    place($('e1ok'), C + 103, C + 103, 0.8 + 0.2 * pk, pk);
  }

  // ================= E02: escaneo del QR con 4G -> carta -> Pedir
  {
    const s0 = S.E02.start, qr = M.qr, food = M.e2_food, tap = M.e2_tap;
    const pp = A(t, s0 + 0.30, IN_D), qout = A(t, food, 0.30);
    place($('e2pill'), 360, 146, 1, pp * (1 - qout));
    op($('e2qr'), 1 - qout);
    const q = lin(t, qr, qr + 0.95);
    $('e2scan').setAttribute('transform', `translate(0 ${(244 + 292 * inout(q)).toFixed(2)})`);
    op($('e2scan'), (q > 0 && q < 1) ? Math.min(1, q / 0.12, (1 - q) / 0.12) : 0);
    const pf = A(t, food + 0.22, IN_D);
    const ef = $('e2food'); op(ef, pf); ef.setAttribute('transform', `translate(0 ${((1 - pf) * 14).toFixed(2)})`);
    const pb = A(t, food + 0.50, IN_D);
    const press = 1 - 0.05 * Math.sin(Math.PI * lin(t, tap, tap + 0.30));
    place($('e2btn'), 360, 560 + (1 - pb) * 14, press, pb);
    const pd = lin(t, tap - 0.05, tap + 0.55);
    op($('e2dot'), (pd > 0 && pd < 1) ? 0.55 * Math.sin(Math.PI * pd) : 0);
    [0, 1].forEach(k => {
      const r = lin(t, tap + 0.05 + 0.22 * k, tap + 1.05 + 0.22 * k), e = $('e2rip' + k);
      e.setAttribute('r', (60 + 110 * ease(r)).toFixed(2));
      e.style.opacity = (r > 0 && r < 1) ? (0.45 * (1 - r)).toFixed(3) : 0;
    });
  }

  // ================= E03: la comanda se divide sola (Cocina / Barra)
  {
    const s0 = S.E03.start, sp = M.e3_lines, go = M.e3_go, TRAV = 0.85;
    place($('e3node'), 0, 0, 1, A(t, s0 + 0.10, IN_D));
    const pl = A(t, sp, 0.60);
    R.cn.forEach((c, k) => {
      c.p.style.strokeDashoffset = (c.L * (1 - pl)).toFixed(2); op(c.p, pl > 0 ? 1 : 0);
      const u = inout(lin(t, go, go + TRAV));
      const pt = c.p.getPointAtLength(c.L * (0.36 + 0.60 * u));
      const arrive = A(t, go + TRAV - 0.12, 0.40);
      const appear = A(t, go - 0.05, 0.40);
      place($('e3m' + k), pt.x, pt.y, 0.55 + 0.45 * appear - 0.25 * arrive, appear * (1 - arrive));
      const lit = A(t, go + TRAV - 0.08, 0.50);
      const col = k ? BAR : KIT, soft = k ? '#efeafe' : '#fef1dc';
      c.p.style.stroke = mix(MUTE, col, u);
      $('e3r' + k).setAttribute('fill', mix('#faf7f2', soft, lit));
      $('e3r' + k).setAttribute('stroke', mix('#e6dfd3', col, lit));
      $('e3i' + k).style.color = mix('#a8a29e', col, lit);
      $('e3t' + k).setAttribute('fill', mix('#a8a29e', col, lit));
    });
  }

  // ================= E04: cada mozo encastra en su sector, 4 · 4 · 4
  {
    const s0 = S.E04.start, drop = M.tags, DUR = 0.70;
    R.COLS.forEach((c, k) => {
      const pa = A(t, s0 + 0.30 + 0.10 * k, IN_D);
      const u = ease(lin(t, drop + 0.20 * k, drop + 0.20 * k + DUR));
      const x0 = 276 + 84 * k, y0 = 88;
      place($('e4m' + k), x0 + (c[1] - x0) * u, y0 + (196 - y0) * u, 0.85 + 0.15 * pa, pa);
      const land = A(t, drop + 0.20 * k + DUR * 0.6, 0.45);
      op($('e4slot' + k), 1 - land);
      $('e4col' + k).setAttribute('stroke', mix('#e6dfd3', c[2], land * 0.55));
      for (let j = 0; j < 4; j++) {
        const lt = A(t, drop + 0.20 * k + DUR * 0.6 + 0.07 * j, 0.45);
        const el = $(`e4t${k}${j}`);
        el.setAttribute('fill', mix('#ffffff', c[3], lt));
        el.setAttribute('stroke', mix(MUTE, c[2], lt));
      }
    });
  }

  // ================= E05: sin celulares -> el pase se enciende, la pulsera vibra y marca el tilde
  {
    const s0 = S.E05.start, ps = M.pase, vb = M.vibra, sl = M.salir;
    const pdv = A(t, s0 + 0.05, 0.60);
    $('e5div').style.strokeDasharray = '480 480'; $('e5div').style.strokeDashoffset = (480 * (1 - pdv)).toFixed(2);
    const pl = A(t, s0 + 0.12, IN_D), pr = A(t, s0 + 0.30, IN_D);
    op($('e5pase'), pl); $('e5pase').setAttribute('transform', `translate(180 ${(318 + (1 - pl) * 12).toFixed(2)})`);
    op($('e5lp'), pl); $('e5lp').setAttribute('transform', `translate(0 ${((1 - pl) * 12).toFixed(2)})`);
    op($('e5lb'), pr); $('e5lb').setAttribute('transform', `translate(0 ${((1 - pr) * 12).toFixed(2)})`);
    // columnas del pase en los colores de los mozos
    const WC = [ACC, OK, BAR];
    WC.forEach((c, k) => {
      const lt = A(t, ps + 0.16 * k, 0.50);
      $('e5col' + k).setAttribute('fill', mix('#ede7dd', c, lt));
      op($('e5av' + k), 0.55 + 0.45 * lt);
      [0, 1].forEach(j => { const pt = A(t, ps + 0.16 * k + 0.18 + 0.12 * j, 0.40); op($(`e5tk${k}${j}`), pt); });
    });
    // pulsera: entra, vibra con ondas laterales verdes suaves
    let shake = 0;
    [0, 1].forEach(k => {
      let o = 0, dx = 0;
      for (let c = 0; c < 2; c++) {
        const u = lin(t, vb + c * 0.55 + k * 0.16, vb + c * 0.55 + k * 0.16 + 0.85);
        if (u > 0 && u < 1) { o = Math.max(o, 0.9 * Math.sin(Math.PI * u)); dx = 12 * ease(u); }
      }
      document.querySelectorAll('.e5w' + k).forEach((w, j) => { w.style.opacity = o.toFixed(3); w.setAttribute('transform', `translate(${(j ? -dx : dx).toFixed(2)} 0)`); });
    });
    const vz = lin(t, vb, vb + 1.0);
    if (vz > 0 && vz < 1) shake = 2.2 * Math.sin(vz * Math.PI * 2 * 9) * Math.sin(Math.PI * vz);
    $('e5band').setAttribute('transform', `translate(${shake.toFixed(2)} ${((1 - pr) * 12).toFixed(2)})`);
    op($('e5band'), pr);
    // al salir: capsula verde + tilde blanco
    const pg = A(t, sl - 0.10, 0.45);
    $('e5scr').setAttribute('fill', mix('#2b2623', OK, pg));
    op($('e5dots'), 1 - A(t, sl - 0.10, 0.25));
    const pk = A(t, sl + 0.10, 0.45);
    R.chk.style.strokeDashoffset = (R.chkL * (1 - pk)).toFixed(2); op(R.chk, pk > 0 ? 1 : 0);
  }

  // ================= E06: cierre institucional
  { const pl = A(t, M.logo, 0.60), pbg = A(t, M.badge, 0.55), pc = A(t, M.contact, 0.60);
    $('closing').style.display = t >= e6 - 0.3 ? 'block' : 'none';
    show($('cLogo'), pl, (1 - pl) * 14); show($('cBadge'), pbg, (1 - pbg) * 14); show($('cCta'), pc, (1 - pc) * 14); }

  await Promise.all(pending);
  return true;
};

window.init = async function (tl, fc) {
  TL = tl; FC = fc; M = tl.marks;
  tl.scenes.forEach(s => { S[s.id] = s; });
  build();
  await document.fonts.ready;
  await Promise.all([700, 800].map(w => document.fonts.load(`${w} 40px PJS`)));
  await Promise.all([...document.querySelectorAll('img')].filter(i => i.src).map(i => i.decode().catch(() => {})));
  const pre = new Image(); pre.src = '../assets/mark.svg'; await pre.decode().catch(() => {});
  await new Promise(r => setTimeout(r, 300));
  return true;
};
</script>
