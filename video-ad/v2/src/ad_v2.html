<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SaleListo Ad v2</title>
<style>
@font-face { font-family: 'PJS'; src: url('../assets/fonts/PJS-500.ttf'); font-weight: 500; }
@font-face { font-family: 'PJS'; src: url('../assets/fonts/PJS-600.ttf'); font-weight: 600; }
@font-face { font-family: 'PJS'; src: url('../assets/fonts/PJS-700.ttf'); font-weight: 700; }
@font-face { font-family: 'PJS'; src: url('../assets/fonts/PJS-800.ttf'); font-weight: 800; }
@font-face { font-family: 'Plus Jakarta Sans'; src: url('../assets/fonts/PJS-700.ttf'); font-weight: 700; }
@font-face { font-family: 'Plus Jakarta Sans'; src: url('../assets/fonts/PJS-800.ttf'); font-weight: 800; }
:root {
  --cream: #faf7f2; --white: #ffffff; --ink: #1f1b16; --muted: #6b6258; --coral: #d9412b; --coral-soft: #fbe6e1;
  --green: #2f8a57; --green-soft: #e1f2e8; --amber: #f59e0b; --amber-d: #c98a12; --amber-soft: #fbf0d8;
  --violet: #7c3aed; --violet-soft: #ede9fe; --blue: #2f6bd9; --line: #e8e1d6; --kds: #181512;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body, div, span { font-family: 'PJS', 'Plus Jakarta Sans', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
.emo { font-family: 'Segoe UI Emoji', 'PJS', sans-serif; }
#vp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #120d0a; }
.abs { position: absolute; }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; will-change: transform; }
.layer img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
.layer .half { position: absolute; left: 0; width: 1080px; height: 960px; overflow: hidden; }
.layer .half img { width: 1080px; height: 960px; }
.layer .half.top { top: 0; } .layer .half.bot { top: 960px; }
#tint { position: absolute; inset: 0; pointer-events: none; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 52%, rgba(0,0,0,0) 55%, rgba(10,5,2,0.42) 100%); }
#scrimTop { position: absolute; left: 0; top: 0; width: 1080px; height: 820px; background: linear-gradient(180deg, rgba(14,8,4,0.66) 0%, rgba(14,8,4,0.40) 38%, rgba(14,8,4,0) 100%); }
#scrimBot { position: absolute; left: 0; bottom: 0; width: 1080px; height: 700px; background: linear-gradient(0deg, rgba(14,8,4,0.45) 0%, rgba(14,8,4,0) 100%); }
.grp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
/* Kinetic title */
.title { position: absolute; left: 70px; width: 940px; text-align: center; color: #fff; font-weight: 800; font-size: 118px; line-height: 1.02; letter-spacing: -0.035em; }
.title .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.12em 0.10em; margin: 0 -0.06em; }
.title .wi { display: inline-block; position: relative; text-shadow: 0 6px 28px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.35); }
.title .hl { position: absolute; left: -0.10em; right: -0.10em; top: 0.10em; bottom: 0.02em; background: var(--coral); border-radius: 0.16em; z-index: -1; transform-origin: 0 50%; box-shadow: 0 10px 30px rgba(217,65,43,0.45); }
.title .wi.hasHl { z-index: 0; text-shadow: none; }
/* Cards */
.card { position: absolute; background: #fff; border-radius: 40px; box-shadow: 0 34px 90px rgba(20,10,4,0.42), 0 6px 18px rgba(0,0,0,0.18); }
.chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 999px; font-weight: 800; font-size: 40px; }
.row { display: flex; align-items: center; }
.ico { width: 92px; height: 92px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 52px; flex: none; }
.ring { position: absolute; border-radius: 50%; border: 8px solid var(--green); }
svg { overflow: visible; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="fb0" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="fb0g" stdDeviation="0 0" edgeMode="duplicate"/></filter>
    <filter id="fb1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="fb1g" stdDeviation="0 0" edgeMode="duplicate"/></filter>
  </defs>
</svg>
<div id="vp">
  <div id="bg">
    <div class="layer" id="L0"><img class="full"><div class="half top"><img></div><div class="half bot"><img></div></div>
    <div class="layer" id="L1"><img class="full"><div class="half top"><img></div><div class="half bot"><img></div></div>
  </div>
  <div id="splitLine" class="abs" style="left:0;top:955px;width:1080px;height:10px;background:#faf7f2;box-shadow:0 0 24px rgba(0,0,0,0.5);opacity:0"></div>
  <div id="tint"></div>
  <div id="vignette"></div>
  <div id="scrimTop"></div>
  <div id="scrimBot"></div>
  <div id="ui"></div>
</div>

<script>
// ============================================================ helpers
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eOut5 = t => 1 - Math.pow(1 - t, 5);
const eInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eIn = t => t * t * t;
const eBack = (t, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
// resorte amortiguado: 0 -> 1 con overshoot
const spring = (t, w = 15, d = 7) => t <= 0 ? 0 : 1 - Math.exp(-d * t) * Math.cos(w * t);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; return e; };
const tf = (e, s) => { e.style.transform = s; };
const op = (e, v) => { e.style.opacity = v; };

let TL = null, FC = {};
const ui = document.getElementById('ui');
const L = [document.getElementById('L0'), document.getElementById('L1')];
const FB = [document.getElementById('fb0g'), document.getElementById('fb1g')];

// ============================================================ Ken Burns por corte
const KB = {
  C01: [1.06, 1.17, 0, -24, 0, 0], C02: [1.15, 1.06, 24, -10, 0, 0], C03: [1.05, 1.13, 0, 0, 10, -10],
  C04: [1.12, 1.05, -26, 20, 0, 0], C05: [1.04, 1.11, 0, 0, 12, -16], C07: [1.06, 1.15, 10, -10, 0, 0],
  C08: [1.04, 1.11, 0, 0, -22, 10], C09: [1.13, 1.04, 0, 0, 0, 0], C10: [1.05, 1.13, -22, 24, 0, 0],
  C11: [1.09, 1.03, 10, -10, 0, 0], C12: [1.04, 1.13, 0, 0, 0, -12], C13: [1.13, 1.05, 0, 0, 0, 0],
  C14: [1.10, 1.22, 30, -30, 0, -20],
  C06_top: [1.05, 1.13, 22, -22, 0, 0], C06_bot: [1.12, 1.04, -22, 22, 0, 0],
};
const BEATPUNCH = [];

function frameSrc(key, cut, t) {
  const n = FC[key] || 1;
  let i = Math.floor((t - cut.start + TL.pre) * TL.srcFps) + 1;
  i = Math.max(1, Math.min(n, i));
  return `../build/frames_src/${key}/f_${String(i).padStart(4, '0')}.jpg`;
}
function kbTransform(key, cut, t) {
  const k = KB[key] || [1.05, 1.1, 0, 0, 0, 0];
  const q = (t - cut.start) / (cut.end - cut.start);
  const s = lerp(k[0], k[1], q), x = lerp(k[2], k[3], q), y = lerp(k[4], k[5], q);
  return `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
}
const pending = [];
function setImg(img, src) {
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
  pending.push(img.decode().catch(() => {}));
}
function paintLayer(layer, cut, t) {
  const full = layer.querySelector('img.full');
  const top = layer.querySelector('.half.top'), bot = layer.querySelector('.half.bot');
  if (cut.src === 'SPLIT') {
    full.style.display = 'none'; top.style.display = 'block'; bot.style.display = 'block';
    const it = top.querySelector('img'), ib = bot.querySelector('img');
    setImg(it, frameSrc('C06_top', cut, t)); setImg(ib, frameSrc('C06_bot', cut, t));
    tf(it, kbTransform('C06_top', cut, t)); tf(ib, kbTransform('C06_bot', cut, t));
  } else {
    full.style.display = 'block'; top.style.display = 'none'; bot.style.display = 'none';
    setImg(full, frameSrc(cut.id, cut, t));
    tf(full, kbTransform(cut.id, cut, t));
    full.style.filter = cut.id === 'C14' ? 'blur(5px) saturate(1.1)' : '';
  }
}

// ============================================================ transiciones
const TD = 0.34; // duracion de transicion
// devuelve {out:{x,y,s,o,bx,by}, in:{...}} para progreso p (0..1)
function transFx(type, p) {
  const e = eInOut(p), b = Math.sin(Math.PI * p);
  const id = { x: 0, y: 0, s: 1, o: 1, bx: 0, by: 0, r: 0 };
  const o = { ...id }, i = { ...id };
  switch (type) {
    case 'whipL': o.x = -e * W; i.x = (1 - e) * W; o.bx = i.bx = 70 * b; break;
    case 'whipR': o.x = e * W; i.x = -(1 - e) * W; o.bx = i.bx = 70 * b; break;
    case 'whipU': o.y = -e * H; i.y = (1 - e) * H; o.by = i.by = 80 * b; break;
    case 'zoom': o.s = 1 + 0.7 * e; o.o = 1 - seg(p, 0.42, 0.62); i.s = 1.45 - 0.45 * eOut(p); i.o = seg(p, 0.38, 0.6);
      o.bx = o.by = 22 * b; i.bx = i.by = 18 * b; break;
    case 'zoomOut': o.s = 1 - 0.32 * e; o.o = 1 - seg(p, 0.55, 0.9); o.r = 70 * e; i.s = 1.18 - 0.18 * e; i.bx = i.by = 10 * b; break;
    case 'split': i.splitP = e; o.bx = o.by = 14 * b; break;
    case 'veil': i.o = seg(p, 0.0, 0.7); break;
  }
  return { out: o, in: i };
}
function applyLayerFx(idx, fx) {
  const layer = L[idx];
  layer.style.transform = `translate(${fx.x.toFixed(1)}px, ${fx.y.toFixed(1)}px) scale(${fx.s.toFixed(4)})`;
  layer.style.opacity = fx.o;
  layer.style.borderRadius = (fx.r || 0) + 'px';
  FB[idx].setAttribute('stdDeviation', `${(fx.bx || 0).toFixed(1)} ${(fx.by || 0).toFixed(1)}`);
  layer.style.filter = (fx.bx > 0.3 || fx.by > 0.3) ? `url(#fb${idx})` : '';
  const top = layer.querySelector('.half.top'), bot = layer.querySelector('.half.bot');
  if (fx.splitP !== undefined) { tf(top, `translateX(${(-(1 - fx.splitP) * W).toFixed(1)}px)`); tf(bot, `translateX(${((1 - fx.splitP) * W).toFixed(1)}px)`); }
  else { tf(top, ''); tf(bot, ''); }
}
function grpFx(g, fx) { // los grupos UI acompañan el movimiento del fondo (sin blur)
  if (!g) return;
  g.style.transform = `translate(${fx.x.toFixed(1)}px, ${fx.y.toFixed(1)}px) scale(${fx.s.toFixed(4)})`;
  g.style.opacity = fx.o;
}

// ============================================================ titulo cinetico
const TITLES = {
  C01: { pos: 300, hl: 2 }, C02: { pos: 300, hl: 2 }, C03: { pos: 300, hl: 2 }, C04: { pos: 300, hl: 2 },
  C05: { pos: 300, hl: 1 }, C06: { pos: 1440, hl: -1, amp: true }, C07: { pos: 270, hl: 1 }, C08: { pos: 300, hl: 1 },
  C09: { pos: 300, hl: 2 }, C10: { pos: 300, hl: 2 }, C11: { pos: 290, hl: 2 }, C12: { pos: 300, hl: 2 }, C13: { pos: 300, hl: 2 },
};
function buildTitle(cut, grp) {
  const cfg = TITLES[cut.id]; if (!cfg || !cut.title) return null;
  const t = el('div', 'title', grp); t.style.top = cfg.pos + 'px';
  const words = cut.title.split(' ');
  const parts = [];
  words.forEach((w, j) => {
    const wrap = el('span', 'w', t); const inner = el('span', 'wi', wrap);
    if (j === cfg.hl) { inner.classList.add('hasHl'); const hl = el('span', 'hl', inner); parts.push({ wrap, inner, hl }); }
    else parts.push({ wrap, inner });
    inner.appendChild(document.createTextNode(w));
    t.appendChild(document.createTextNode(' '));
  });
  return { el: t, parts };
}
function animTitle(T, cut, t) {
  if (!T) return;
  const base = cut.start + 0.04;
  T.parts.forEach((p, j) => {
    const lt = t - (base + j * 0.07);
    const k = eBack(seg(lt, 0, 0.34), 1.4);
    const ex = seg(t, cut.end - 0.20, cut.end - 0.02);
    tf(p.inner, `translateY(${((1 - k) * 115 - eIn(ex) * 40).toFixed(1)}%)`);
    op(p.inner, lt < 0 ? 0 : 1 - ex);
    if (p.hl) tf(p.hl, `scaleX(${eOut5(seg(lt, 0.16, 0.42)).toFixed(3)})`);
  });
  // stomp sutil al entrar
  const st = seg(t, base + 0.1, base + 0.36);
  tf(T.el, `scale(${(1 + 0.06 * Math.sin(Math.PI * st) * (1 - st)).toFixed(4)})`);
}

// ============================================================ componentes UI
const G = {}; // grupos por corte
const C = {}; // referencias a elementos
function svgWifi(size, color) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">
    <path class="a3" d="M8 38 Q50 2 92 38" stroke="${color}" stroke-width="9" stroke-linecap="round"/>
    <path class="a2" d="M22 53 Q50 28 78 53" stroke="${color}" stroke-width="9" stroke-linecap="round"/>
    <path class="a1" d="M36 68 Q50 56 64 68" stroke="${color}" stroke-width="9" stroke-linecap="round"/>
    <circle class="a0" cx="50" cy="82" r="7" fill="${color}"/>
    <path class="slash" d="M14 14 L86 92" stroke="#ff3b2f" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
  </svg>`;
}
function fakeQR(n = 25, px = 300) {
  // patron ilustrativo tipo QR (no codifica ningun enlace)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const c = px / n; let r = '';
  const finder = (x, y) => { r += `<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" rx="${c*1.2}" fill="#1f1b16"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" rx="${c*0.8}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" rx="${c*0.6}" fill="#1f1b16"/>`; };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > 0.52) r += `<rect x="${x*c+1}" y="${y*c+1}" width="${c-2}" height="${c-2}" rx="${c*0.3}" fill="#1f1b16"/>`;
  }
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  // centro con el isotipo
  r += `<rect x="${px/2-34}" y="${px/2-34}" width="68" height="68" rx="16" fill="#fff"/><image href="../assets/mark.svg" x="${px/2-28}" y="${px/2-28}" width="56" height="56"/>`;
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}">${r}</svg>`;
}
const CHECK_SVG = (sz, sw = 16) => `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100" fill="none"><path class="chk" d="M27 52 L44 68 L74 35" stroke="#fff" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`;

function buildUI() {
  TL.cuts.forEach(c => { G[c.id] = el('div', 'grp', ui); G[c.id].dataset.cut = c.id; C[c.id] = { title: buildTitle(c, G[c.id]) }; });
  // ---- C01: Wi-Fi caido + reloj (grupo global para que lo barra el isotipo en C02)
  const gw = G.wifi = el('div', 'grp', ui);
  const wc = C.wifi = {};
  wc.disc = css(el('div', 'abs', gw), { left: '360px', top: '780px', width: '360px', height: '360px', borderRadius: '50%', background: 'rgba(24,18,14,0.62)', border: '3px solid rgba(255,255,255,0.18)', boxShadow: '0 30px 80px rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center' });
  wc.disc.innerHTML = `<div style="position:relative;width:210px;height:210px"><div class="gR" style="position:absolute;inset:0">${svgWifi(210, '#ff4d3d')}</div><div class="gC" style="position:absolute;inset:0;mix-blend-mode:screen">${svgWifi(210, '#3de0ff')}</div><div class="gW" style="position:absolute;inset:0">${svgWifi(210, '#ffffff')}</div></div>`;
  wc.clock = css(el('div', 'chip', gw, `<span class="emo" style="font-size:44px">⏱</span><span class="num">12</span><span style="font-weight:700;font-size:34px;opacity:.85">min</span>`), { left: '610px', top: '1110px', background: '#d9412b', color: '#fff', boxShadow: '0 16px 40px rgba(217,65,43,0.5)' });
  wc.disc.firstChild.style.display = 'none'; wc.disc.insertAdjacentHTML('beforeend', '<span class="emo" style="font-size:170px">🏃</span>'); wc.clock.style.display = 'none';
  wc.reqs = [['🙋', 'Mesa 4 · ¡Carta!', 70, 560], ['🔑', '¿Clave Wi-Fi?', 590, 600], ['🍸', '¿Y mi trago?', 60, 1210], ['🧾', '¡La cuenta!', 600, 1250]].map(r => css(el('div', 'chip', gw, `<span class="emo" style="font-size:48px">${r[0]}</span><span>${r[1]}</span>`), { left: r[2] + 'px', top: r[3] + 'px', background: '#fff', color: '#1f1b16', fontSize: '42px', border: '4px solid #d9412b', boxShadow: '0 18px 44px rgba(0,0,0,0.45)' }));
  // ---- C02: isotipo con resorte
  const c2 = C.C02;
  c2.mark = css(el('img', 'abs', G.C02), { left: '380px', top: '800px', width: '320px', height: '320px', filter: 'drop-shadow(0 30px 60px rgba(217,65,43,0.55))' }); c2.mark.src = '../assets/mark.svg';
  c2.glow = css(el('div', 'ring', G.C02), { left: '340px', top: '760px', width: '400px', height: '400px', borderColor: 'rgba(255,255,255,0.85)', borderWidth: '6px' });
  // ---- C03: QR + visor + pulsos 4G
  const c3 = C.C03;
  c3.card = css(el('div', 'card', G.C03), { left: '300px', top: '820px', width: '480px', height: '540px', padding: '30px 90px', display: 'flex', flexDirection: 'column', alignItems: 'center' });
  c3.card.innerHTML = `<div style="font-weight:800;font-size:40px;color:#1f1b16;margin-bottom:22px;letter-spacing:-0.02em">Mesa <span style="color:#d9412b">T2</span></div>${fakeQR(25, 300)}`;
  c3.scan = css(el('div', 'abs', G.C03), { left: '330px', top: '920px', width: '420px', height: '8px', borderRadius: '4px', background: 'linear-gradient(90deg, rgba(217,65,43,0), #d9412b, rgba(217,65,43,0))', boxShadow: '0 0 30px 6px rgba(217,65,43,0.6)' });
  c3.corners = [0, 1, 2, 3].map(i => { const d = el('div', 'abs', G.C03); const b = '12px solid #ffffff'; css(d, { width: '110px', height: '110px', borderRadius: '10px' });
    if (i === 0) css(d, { borderTop: b, borderLeft: b, borderTopLeftRadius: '38px' }); if (i === 1) css(d, { borderTop: b, borderRight: b, borderTopRightRadius: '38px' });
    if (i === 2) css(d, { borderBottom: b, borderLeft: b, borderBottomLeftRadius: '38px' }); if (i === 3) css(d, { borderBottom: b, borderRight: b, borderBottomRightRadius: '38px' }); return d; });
  c3.rings = [0, 1, 2].map(() => css(el('div', 'ring', G.C03), { left: '340px', top: '890px', width: '400px', height: '400px', borderColor: '#3fd17f', borderWidth: '10px' }));
  c3.chip = css(el('div', 'chip', G.C03, `<svg width="44" height="44" viewBox="0 0 24 24"><rect x="2" y="15" width="4" height="7" rx="1.5" fill="#fff"/><rect x="8" y="11" width="4" height="11" rx="1.5" fill="#fff"/><rect x="14" y="7" width="4" height="15" rx="1.5" fill="#fff"/><rect x="20" y="3" width="3.5" height="19" rx="1.5" fill="#fff" opacity=".55"/></svg><span style="font-size:54px">4G</span>`), { left: '690px', top: '735px', background: '#2f8a57', color: '#fff', boxShadow: '0 18px 44px rgba(47,138,87,0.55)', padding: '18px 34px' });
  // ---- C04: tarjeta de pedido
  const c4 = C.C04;
  c4.card = css(el('div', 'card', G.C04), { left: '120px', top: '880px', width: '840px', padding: '40px 44px 34px' });
  const rowH = (emo, bg, name, qtyCls) => `<div class="row" style="justify-content:space-between;padding:22px 0;border-top:2px solid #f1ece4">

// ============================================================ animaciones por corte
function vis(g, on) { g.style.display = on ? 'block' : 'none'; }
function ringAnim(r, cx, cy, t0, t, d0 = 120, d1 = 520, dur = 0.6) {
  const k = seg(t, t0, t0 + dur); const d = lerp(d0, d1, eOut(k));
  css(r, { left: (cx - d / 2) + 'px', top: (cy - d / 2) + 'px', width: d + 'px', height: d + 'px', opacity: (k <= 0 || k >= 1) ? 0 : (1 - k) * 0.95 });
}
function tapAnim(e, x0, y0, x1, y1, t0, tPress, t) {
  const k = eOut(seg(t, t0, tPress));
  const pr = seg(t, tPress, tPress + 0.12), rel = seg(t, tPress + 0.12, tPress + 0.3);
  const s = 1 - 0.25 * Math.sin(Math.PI * clamp(pr + rel * 0)) ;
  css(e, { left: (lerp(x0, x1, k) - 60) + 'px', top: (lerp(y0, y1, k) - 60) + 'px', opacity: t < t0 ? 0 : (1 - seg(t, tPress + 0.25, tPress + 0.45)), transform: `scale(${(pr < 1 ? 1 - 0.22 * pr : 0.78 + 0.22 * rel).toFixed(3)})` });
}

function animate(t) {
  const cuts = TL.cuts;
  const cutOf = id => cuts.find(c => c.id === id);
  // ---- Wi-Fi (0 -> 2.2)
  { const g = G.wifi, w = C.wifi; const c2s = cutOf('C02').start; const on = t < c2s + 0.45; vis(g, on);
    if (on) {
      const ent = spring(t - 0.05, 16, 7);
      const sweep = eIn(seg(t, c2s + 0.06, c2s + 0.38));
      const shake = t > 1.2 && t < 1.55 ? Math.sin(t * 120) * 22 * (1 - seg(t, 1.2, 1.55)) : 0;
      tf(w.disc, `translate(${(shake - sweep * 1000).toFixed(1)}px, ${(sweep * -120).toFixed(1)}px) scale(${(0.4 + 0.6 * ent).toFixed(3)}) rotate(${(-sweep * 40).toFixed(1)}deg)`);
      op(w.disc, clamp(t / 0.12));
      // arcos que intentan conectarse y fallan
      const cyc = (t * 3.2) % 1; const dead = t > 1.2;
      const layers = w.disc.querySelectorAll('.gW, .gR, .gC');
      const white = w.disc.querySelector('.gW'), red = w.disc.querySelector('.gR'), cyan = w.disc.querySelector('.gC');
      ['a0', 'a1', 'a2', 'a3'].forEach((a, i) => { const v = dead ? (i === 0 ? 1 : 0.18) : (cyc * 4 > i ? 1 : 0.15); white.querySelector('.' + a).style.opacity = v; red.querySelector('.' + a).style.opacity = v; cyan.querySelector('.' + a).style.opacity = v; });
      white.querySelectorAll('path:not(.slash),circle').forEach(p => { p.setAttribute('stroke', dead ? '#ffb3aa' : '#ffffff'); if (p.tagName === 'circle') p.setAttribute('fill', dead ? '#ffb3aa' : '#ffffff'); });
      const sl = eOut(seg(t, 1.2, 1.38));
      [white, red, cyan].forEach(l => l.querySelector('.slash').setAttribute('stroke-dashoffset', (1 - sl).toFixed(3)));

// ============================================================ render de frame
window.renderFrame = async function (f) {
  pending.length = 0;
  const t = f / TL.fps;
  const cuts = TL.cuts;
  let i = cuts.findIndex(c => t >= c.start && t < c.end); if (i < 0) i = cuts.length - 1;
  // transicion activa?
  let trans = null;
  for (let k = 1; k < cuts.length; k++) {
    const c = cuts[k]; const a = c.start - TD / 2, b = c.start + TD / 2;
    if (c.trans === 'veil') { if (t >= c.start - 0.17 && t < c.start + 0.25) trans = { from: k - 1, to: k, p: seg(t, c.start - 0.17, c.start + 0.25), type: 'veil' }; continue; }
    if (t >= a && t < b) trans = { from: k - 1, to: k, p: (t - a) / TD, type: c.trans };
  }
  // visibilidad de grupos UI
  cuts.forEach((c, k) => {
    const g = G[c.id]; let on = (k === i);
    if (trans && (k === trans.from || k === trans.to)) on = true;
    if (c.id === 'C14') on = t >= c.start - 0.2;
    vis(g, on); grpFx(g, { x: 0, y: 0, s: 1, o: 1 });
  });
  if (trans) {
    const fx = transFx(trans.type, trans.p);
    paintLayer(L[0], cuts[trans.from], t); paintLayer(L[1], cuts[trans.to], t);
    L[0].style.display = 'block'; L[1].style.display = 'block';
    applyLayerFx(0, fx.out); applyLayerFx(1, fx.in);
    if (trans.type !== 'veil') { grpFx(G[cuts[trans.from].id], trans.type === 'split' ? { ...fx.out, o: 1 - seg(trans.p, 0.05, 0.5) } : fx.out); grpFx(G[cuts[trans.to].id], { ...fx.in, o: fx.in.o }); }
    if (cuts[trans.from].id === 'C10' || cuts[trans.from].id === 'C01') { /* grupos globales acompañan */ }
    if (cuts[trans.from].id === 'C10') grpFx(G.grid, fx.out); else grpFx(G.grid, { x: 0, y: 0, s: 1, o: 1 });
    if (trans.type === 'veil') { G.C13.style.opacity = 1 - seg(trans.p, 0.2, 0.6); }
  } else {
    paintLayer(L[0], cuts[i], t); L[0].style.display = 'block'; L[1].style.display = 'none';
    applyLayerFx(0, { x: 0, y: 0, s: 1, o: 1, bx: 0, by: 0 });
    grpFx(G.grid, { x: 0, y: 0, s: 1, o: 1 });
  }
  // punch sutil en cada downbeat (cada 4 beats desde 1.20 s)
  const bg = document.getElementById('bg');
  const db = (t - 1.20) / (TL.beat * 4); const sinceDown = (db - Math.floor(db)) * TL.beat * 4;
  const c14s = cuts.find(c => c.id === 'C14').start, c2s = cuts.find(c => c.id === 'C02').start;
  const punch = t >= 1.2 && t < c14s - 0.15 ? 0.018 * Math.exp(-sinceDown / 0.11) : 0;
  bg.style.transform = `scale(${(1 + punch).toFixed(4)})`;
  // linea divisoria del split
  const c6 = cuts.find(c => c.id === 'C06');
  document.getElementById('splitLine').style.opacity = (t >= c6.start && t < c6.end - 0.05) ? 1 : (trans && trans.type === 'split' ? trans.p : 0);
  // tinte: rojo tenso en el gancho, calido despues
  const tension = 1 - seg(t, c2s - 0.15, c2s + 0.25);
  document.getElementById('tint').style.background = `rgba(${Math.round(lerp(60, 40, 1 - tension))}, ${Math.round(lerp(4, 18, 1 - tension))}, 0, ${(0.30 * tension + 0.06).toFixed(3)})`;
  document.getElementById('scrimTop').style.opacity = t > c14s - 0.07 ? 1 - seg(t, c14s - 0.17, c14s + 0.13) : 1;
  document.getElementById('scrimBot').style.opacity = t > c14s - 0.07 ? 1 - seg(t, c14s - 0.17, c14s + 0.13) : 1;
  document.getElementById('vignette').style.opacity = t > c14s - 0.07 ? 1 - 0.7 * seg(t, c14s - 0.17, c14s + 0.13) : 1;
  // titulos
  cuts.forEach(c => { if (G[c.id].style.display !== 'none') animTitle(C[c.id].title, c, t); });
  animate(t);
  await Promise.all(pending);
  return true;
};

window.init = async function (tl, fc) {
  TL = tl; FC = fc;
  buildUI();
  await document.fonts.ready;
  await Promise.all(['PJS'].map(f => Promise.all([500, 600, 700, 800].map(w => document.fonts.load(`${w} 40px ${f}`)))));
  // precarga de imagenes SVG
  await Promise.all([...document.querySelectorAll('img')].filter(i => i.src).map(i => i.decode().catch(() => {})));
  return true;
};
</script>
